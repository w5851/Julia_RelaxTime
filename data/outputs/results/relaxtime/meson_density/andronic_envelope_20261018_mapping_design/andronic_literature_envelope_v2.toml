baseline_fine_manifest = "data/outputs/results/relaxtime/meson_density/freezeout_defaults_20261017_fine/manifest.json"
baseline_policy = "Reuse the completed Andronic 2018 trajectories and ratios; preserve failed coordinates. Recalculate only if the numerical or physics contract changes."
workflow_reference = "docs/guides/scripts/meson_freezeout_comparison.md"

