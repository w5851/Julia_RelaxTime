schema = "chemical_freezeout_andronic_envelope_v2"
family = "andronic_logistic_rational_v1"
parameter_order = ["T_lim_GeV", "log_offset", "log_width", "d_GeV", "e_GeV_inv1"]
formula = "x=sqrt_s_NN_GeV; T=T_lim_GeV/(1+exp(log_offset-log(x)/log_width)); muB=d_GeV/(1+e_GeV_inv1*x)"
policy = "closed coordinate box of selected literature central values; temperature-only sources contribute only their provided coefficients; exploratory domain, not a confidence region"
author_decision = "Update the previous three-group box using the three verified foreign-team papers and the Andronic 2026 v2 review. Continue to exclude Yu 2025 Set I and Set III."
selection_status = "author_selected_for_research"
cross_source_combinations = true
expand_by_reported_errors = false
same_parameters_at_all_energies = true
previous_domain = "config/physics/freezeout/parameter_domains/andronic_literature_envelope_v1.toml"
previous_domain_sha256 = "4c4532c84292d94ff1eb40ba318c197629319e96254291ad0ac202078f0bf6ca"
source_manifest = "data/inputs/meson_freezeout_andronic_literature_20261018/recent_sources_manifest.json"
previous_source_manifest = "data/inputs/meson_freezeout_andronic_literature_20261018/source_manifest.json"
report = "docs/analysis/relaxtime/meson_freezeout_defaults_20261017_analysis/andronic_family_20261018.md"

[bounds]
T_lim_GeV = [0.1535, 0.164]
log_offset = [2.20, 2.82]
log_width = [0.40, 0.48]
d_GeV = [1.050, 1.3568]
e_GeV_inv1 = [0.286, 0.326]

[comparison]
primary_energies_GeV = [7.7, 11.5, 14.5, 19.6, 27.0, 39.0, 62.4, 130.0, 200.0]
