name: benchmarks

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "benchmark/**"
      - "scripts/analysis/**"
      - "scripts/perf/**"
      - "scripts/pnjl/**"
      - "scripts/relaxtime/**"
      - "scripts/plot_scan_csv.py"
      - "scripts/dev/check_script_entrypoints.jl"
      - "scripts/dev/check_python_script_syntax.py"
      - ".github/workflows/pnjl-benchmarks.yml"
  pull_request:
    paths:
      - "src/**"
      - "benchmark/**"
      - "scripts/analysis/**"
      - "scripts/perf/**"
      - "scripts/pnjl/**"
      - "scripts/relaxtime/**"
      - "scripts/plot_scan_csv.py"
      - "scripts/dev/check_script_entrypoints.jl"
      - "scripts/dev/check_python_script_syntax.py"
      - ".github/workflows/pnjl-benchmarks.yml"

jobs:
  pnjl-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.5"

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Run PNJL single-point benchmark
        run: julia --project=. benchmark/pnjl/single_point_solver_perf.jl

      - name: Run PNJL scan benchmark
        run: julia --project=. scripts/perf/pnjl/scan_perf.jl

      - name: Check benchmark thresholds
        run: julia --project=. scripts/dev/check_benchmark_thresholds.jl

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: pnjl-benchmark
          path: |
            tests/perf/results/pnjl/single_point_benchmark.json
            tests/perf/results/pnjl/single_point_benchmark.md
            tests/perf/results/pnjl/scan_benchmark.json
            tests/perf/results/pnjl/scan_benchmark.md

  julia-script-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.5"

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Check PNJL and relaxtime Julia script entrypoints
        run: julia --project=. scripts/dev/check_script_entrypoints.jl

  python-script-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check plotting and helper Python scripts
        run: python scripts/dev/check_python_script_syntax.py
