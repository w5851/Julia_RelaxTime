name: PNJL Maxwell endpoint-limit production shadow

on:
  workflow_dispatch:
    inputs:
      calculation_ref:
        description: "Immutable 40-character production calculation SHA"
        required: true
        type: string
      scope:
        description: "18-anchor targeted or 24-anchor full shadow"
        required: false
        default: targeted
        type: choice
        options: [targeted, full]
      mode:
        description: "Numerical run or authenticated aggregate replay"
        required: false
        default: numerical
        type: choice
        options: [numerical, aggregate_replay]
      source_run_id:
        description: "Completed numerical source run for aggregate replay"
        required: false
        default: ""
        type: string
      deep_oracle_run_id:
        description: "Approved deep-oracle run to overlay only standard-ambiguous points"
        required: false
        default: ""
        type: string
      tag:
        description: "Versioned endpoint-limit artifact tag"
        required: false
        default: cep_maxwell_endpoint_production_shadow_v3
        type: string

permissions:
  contents: read
  actions: read

jobs:
  shadow:
    if: ${{ inputs.mode == 'numerical' }}
    name: "endpoint shadow xi=${{ matrix.xi }} method=${{ matrix.method }}"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        xi: ["-0.5", "0.0", "0.5"]
        method: [production_hybrid, memoized_dense, independent_oracle]
    steps:
      - name: Validate immutable calculation ref
        shell: bash
        env:
          CALCULATION_REF: ${{ inputs.calculation_ref }}
        run: |
          [[ "$CALCULATION_REF" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1

      - name: Checkout calculation SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.calculation_ref }}
          fetch-depth: 1

      - name: Verify checkout SHA
        shell: bash
        env:
          CALCULATION_REF: ${{ inputs.calculation_ref }}
        run: test "$(git rev-parse HEAD)" = "$CALCULATION_REF"

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.5"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2
        with:
          cache-name: julia-cache-maxwell-endpoint-production-shadow-v3

      - name: Install Julia dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Run endpoint-limit shadow job
        shell: bash
        env:
          XI: ${{ matrix.xi }}
          METHOD: ${{ matrix.method }}
          TAG: ${{ inputs.tag }}
          CALCULATION_REF: ${{ inputs.calculation_ref }}
          SCOPE: ${{ inputs.scope }}
        run: |
          mkdir -p "artifacts/${METHOD}/xi_${XI}"
          julia --project=. scripts/analysis/pnjl_cep_hybrid_production_shadow.jl \
            --xi "$XI" --method "$METHOD" --tag "$TAG" \
            --calculation-sha "$CALCULATION_REF" --scope "$SCOPE" \
            --output-dir "artifacts/${METHOD}/xi_${XI}"

      - name: Upload endpoint-limit job artifact
        uses: actions/upload-artifact@v4
        with:
          name: cep-maxwell-endpoint-production-shadow-${{ matrix.method }}-xi-${{ matrix.xi }}
          path: artifacts/${{ matrix.method }}/xi_${{ matrix.xi }}
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: aggregate endpoint-limit shadow evidence
    if: ${{ always() && inputs.mode == 'numerical' }}
    needs: [shadow]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout calculation SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.calculation_ref }}
          fetch-depth: 1

      - name: Download endpoint-limit job artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cep-maxwell-endpoint-production-shadow-*
          path: job-artifacts
          merge-multiple: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fixed plotting dependency
        run: python -m pip install matplotlib==3.9.2

      - name: Collect and gate endpoint-limit evidence
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          CALCULATION_REF: ${{ inputs.calculation_ref }}
          SCOPE: ${{ inputs.scope }}
        run: |
          set +e
          python scripts/analysis/collect_pnjl_cep_hybrid_production_shadow.py \
            --input-dir job-artifacts --output-dir aggregate \
            --run-id "$RUN_ID" --source-run-id "$RUN_ID" \
            --expected-calculation-sha "$CALCULATION_REF" --scope "$SCOPE" \
            --schema-version cep_maxwell_endpoint_production_shadow_v3 \
            --endpoint-mode --postprocess-sha "${GITHUB_SHA}" \
            --run-mode numerical
          status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then exit "$status"; fi
          python scripts/analysis/plot_pnjl_cep_hybrid_production_shadow.py \
            --input-dir aggregate --output-dir aggregate/figures
          cat aggregate/manifest.json >> "$GITHUB_STEP_SUMMARY"
          echo "collector_verdict_status=$status" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload endpoint-limit aggregate
        uses: actions/upload-artifact@v4
        with:
          name: cep-maxwell-endpoint-production-shadow-${{ inputs.tag }}-aggregate
          path: aggregate
          if-no-files-found: error
          retention-days: 90

  aggregate_replay:
    name: replay endpoint-limit shadow evidence
    if: ${{ inputs.mode == 'aggregate_replay' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Validate replay inputs
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          CALCULATION_REF: ${{ inputs.calculation_ref }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "source_run_id is required for replay"; exit 1; }
          [[ "$CALCULATION_REF" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1

      - name: Checkout current postprocess head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify source run and download numeric artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          DEEP_RUN_ID: ${{ inputs.deep_oracle_run_id }}
        run: |
          set -euo pipefail
          source_json="$(gh run view "$SOURCE_RUN_ID" --json status,conclusion,headSha)"
          test "$(echo "$source_json" | jq -r .status)" = completed
          test "$(echo "$source_json" | jq -r .conclusion)" = success
          mkdir -p job-artifacts
          for method in production_hybrid memoized_dense independent_oracle; do
            gh run download "$SOURCE_RUN_ID" \
              --name "cep-maxwell-endpoint-production-shadow-${method}-xi--0.5" \
              --dir job-artifacts
            gh run download "$SOURCE_RUN_ID" \
              --name "cep-maxwell-endpoint-production-shadow-${method}-xi-0.0" \
              --dir job-artifacts
            gh run download "$SOURCE_RUN_ID" \
              --name "cep-maxwell-endpoint-production-shadow-${method}-xi-0.5" \
              --dir job-artifacts
          done
          if [[ -n "$DEEP_RUN_ID" ]]; then
            mkdir -p deep-artifacts
            gh run download "$DEEP_RUN_ID" --name "cep-deep-oracle-cep_maxwell_endpoint_production_shadow_v3_required_three_deep-aggregate" --dir deep-artifacts
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fixed plotting dependency
        run: python -m pip install matplotlib==3.9.2

      - name: Replay and gate endpoint evidence
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          DEEP_RUN_ID: ${{ inputs.deep_oracle_run_id }}
          CALCULATION_REF: ${{ inputs.calculation_ref }}
          SCOPE: ${{ inputs.scope }}
        run: |
          set +e
          deep_args=()
          if [[ -n "$DEEP_RUN_ID" ]]; then deep_args+=(--deep-input-dir deep-artifacts --deep-run-id "$DEEP_RUN_ID"); fi
          python scripts/analysis/collect_pnjl_cep_hybrid_production_shadow.py \
            --input-dir job-artifacts --output-dir aggregate \
            --run-id "$SOURCE_RUN_ID" --source-run-id "$SOURCE_RUN_ID" \
            --expected-calculation-sha "$CALCULATION_REF" --scope "$SCOPE" \
            --schema-version cep_maxwell_endpoint_production_shadow_v3 \
            --endpoint-mode --run-mode aggregate_replay \
            --postprocess-sha "${GITHUB_SHA}" "${deep_args[@]}"
          status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then exit "$status"; fi
          python scripts/analysis/plot_pnjl_cep_hybrid_production_shadow.py \
            --input-dir aggregate --output-dir aggregate/figures
          cat aggregate/manifest.json >> "$GITHUB_STEP_SUMMARY"
          echo "collector_verdict_status=$status" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload replay aggregate
        uses: actions/upload-artifact@v4
        with:
          name: cep-maxwell-endpoint-production-shadow-replay-${{ inputs.tag }}
          path: aggregate
          if-no-files-found: error
          retention-days: 90
