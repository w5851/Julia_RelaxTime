name: PNJL CEP Cascade Production Shadow

on:
  workflow_dispatch:
    inputs:
      calculation_ref:
        description: "Immutable 40-character calculation SHA"
        required: true
        type: string
      tag:
        description: "Diagnostic artifact tag"
        required: false
        default: "cep_cascade_production_shadow_v1"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  shadow:
    name: "shadow xi=${{ matrix.xi }} method=${{ matrix.method }}"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        xi: ["-0.5", "0.0", "0.5"]
        method: [production_cascade, memoized_dense, independent_oracle]
    steps:
      - name: Validate immutable calculation ref
        shell: bash
        env:
          CALCULATION_REF: ${{ inputs.calculation_ref }}
        run: |
          [[ "$CALCULATION_REF" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "calculation_ref must be a 40-character immutable SHA" >&2
            exit 1
          }

      - name: Checkout calculation SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.calculation_ref }}
          fetch-depth: 1

      - name: Verify checkout SHA
        shell: bash
        env:
          CALCULATION_REF: ${{ inputs.calculation_ref }}
        run: test "$(git rev-parse HEAD)" = "$CALCULATION_REF"

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.5"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2
        with:
          cache-name: julia-cache-cep-production-shadow-v1

      - name: Install Julia dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Run one production shadow job
        shell: bash
        env:
          XI: ${{ matrix.xi }}
          METHOD: ${{ matrix.method }}
          TAG: ${{ inputs.tag }}
          CALCULATION_REF: ${{ inputs.calculation_ref }}
        run: |
          mkdir -p "artifacts/${METHOD}/xi_${XI}"
          julia --project=. scripts/analysis/pnjl_cep_production_shadow.jl \
            --xi "$XI" \
            --method "$METHOD" \
            --tag "$TAG" \
            --calculation-sha "$CALCULATION_REF" \
            --output-dir "artifacts/${METHOD}/xi_${XI}"

      - name: Upload shadow job artifact
        uses: actions/upload-artifact@v4
        with:
          name: cep-cascade-production-shadow-${{ matrix.method }}-xi-${{ matrix.xi }}
          path: artifacts/${{ matrix.method }}/xi_${{ matrix.xi }}
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: aggregate production shadow evidence
    if: ${{ always() }}
    needs: [shadow]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout calculation SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.calculation_ref }}
          fetch-depth: 1

      - name: Download shadow job artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cep-cascade-production-shadow-*
          path: job-artifacts
          merge-multiple: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect and gate shadow evidence
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          CALCULATION_REF: ${{ inputs.calculation_ref }}
        run: |
          set +e
          python scripts/analysis/collect_pnjl_cep_production_shadow.py \
            --input-dir job-artifacts \
            --output-dir aggregate \
            --run-id "$RUN_ID" \
            --expected-calculation-sha "$CALCULATION_REF"
          status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi
          python scripts/analysis/plot_pnjl_cep_production_shadow.py \
            --input-dir aggregate \
            --output-dir aggregate/figures
          echo "collector_verdict_status=$status" >> "$GITHUB_STEP_SUMMARY"
          cat aggregate/manifest.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate shadow evidence
        uses: actions/upload-artifact@v4
        with:
          name: cep-cascade-production-shadow-${{ inputs.tag }}-aggregate
          path: aggregate
          if-no-files-found: error
          retention-days: 90
