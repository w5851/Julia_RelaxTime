name: PNJL CEP Hybrid Production Shadow

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full numerical shadow or aggregate-only replay"
        required: false
        default: "full"
        type: choice
        options: [full, aggregate_replay]
      calculation_ref:
        description: "Immutable 40-character calculation SHA"
        required: true
        type: string
      source_run_id:
        description: "Completed numerical source run id for aggregate replay"
        required: false
        default: ""
        type: string
      source_calculation_sha:
        description: "Calculation SHA recorded by the source run for replay"
        required: false
        default: ""
        type: string
      tag:
        description: "Diagnostic artifact tag"
        required: false
        default: "cep_cascade_production_shadow_v2"
        type: string
      scope:
        description: "Targeted 18-anchor validation or full 24-anchor shadow"
        required: false
        default: "full"
        type: choice
        options: [targeted, full]

permissions:
  contents: read
  actions: read

jobs:
  shadow:
    if: ${{ inputs.mode != 'aggregate_replay' }}
    name: "hybrid shadow xi=${{ matrix.xi }} method=${{ matrix.method }}"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        xi: ["-0.5", "0.0", "0.5"]
        method: [production_hybrid, memoized_dense, independent_oracle]
    steps:
      - name: Validate immutable calculation ref
        shell: bash
        env:
          CALCULATION_REF: ${{ inputs.calculation_ref }}
        run: |
          [[ "$CALCULATION_REF" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "calculation_ref must be a 40-character immutable SHA" >&2
            exit 1
          }

      - name: Checkout calculation SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.calculation_ref }}
          fetch-depth: 1

      - name: Verify checkout SHA
        shell: bash
        env:
          CALCULATION_REF: ${{ inputs.calculation_ref }}
        run: test "$(git rev-parse HEAD)" = "$CALCULATION_REF"

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.5"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2
        with:
          cache-name: julia-cache-cep-hybrid-production-shadow-v2

      - name: Install Julia dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Run one hybrid shadow job
        shell: bash
        env:
          XI: ${{ matrix.xi }}
          METHOD: ${{ matrix.method }}
          TAG: ${{ inputs.tag }}
          CALCULATION_REF: ${{ inputs.calculation_ref }}
          SCOPE: ${{ inputs.scope }}
        run: |
          mkdir -p "artifacts/${METHOD}/xi_${XI}"
          julia --project=. scripts/analysis/pnjl_cep_hybrid_production_shadow.jl \
            --xi "$XI" \
            --method "$METHOD" \
            --tag "$TAG" \
            --calculation-sha "$CALCULATION_REF" \
            --scope "$SCOPE" \
            --output-dir "artifacts/${METHOD}/xi_${XI}"

      - name: Upload hybrid shadow job artifact
        uses: actions/upload-artifact@v4
        with:
          name: cep-hybrid-production-shadow-${{ matrix.method }}-xi-${{ matrix.xi }}
          path: artifacts/${{ matrix.method }}/xi_${{ matrix.xi }}
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: aggregate hybrid shadow evidence
    if: ${{ always() && inputs.mode != 'aggregate_replay' }}
    needs: [shadow]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout calculation SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.calculation_ref }}
          fetch-depth: 1

      - name: Download hybrid shadow job artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cep-hybrid-production-shadow-*
          path: job-artifacts
          merge-multiple: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fixed plotting dependency
        run: python -m pip install matplotlib==3.9.2

      - name: Collect and gate hybrid shadow evidence
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          CALCULATION_REF: ${{ inputs.calculation_ref }}
          SCOPE: ${{ inputs.scope }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python scripts/analysis/collect_pnjl_cep_hybrid_production_shadow.py \
            --input-dir job-artifacts \
            --output-dir aggregate \
            --run-id "$RUN_ID" \
            --expected-calculation-sha "$CALCULATION_REF" \
            --scope "$SCOPE" \
            --postprocess-sha "${GITHUB_SHA}" \
            --source-run-id "$RUN_ID"
          status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi
          python scripts/analysis/plot_pnjl_cep_hybrid_production_shadow.py \
            --input-dir aggregate \
            --output-dir aggregate/figures
          echo "collector_verdict_status=$status" >> "$GITHUB_STEP_SUMMARY"
          cat aggregate/manifest.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate hybrid evidence
        uses: actions/upload-artifact@v4
        with:
          name: cep-hybrid-production-shadow-${{ inputs.tag }}-aggregate
          path: aggregate
          if-no-files-found: error
          retention-days: 90

  aggregate_replay:
    name: replay hybrid shadow aggregate evidence
    if: ${{ inputs.mode == 'aggregate_replay' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate replay inputs
        shell: bash
        env:
          CALCULATION_REF: ${{ inputs.calculation_ref }}
          SOURCE_CALCULATION_SHA: ${{ inputs.source_calculation_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          [[ "$CALCULATION_REF" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
          [[ "$SOURCE_CALCULATION_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
          [[ "$CALCULATION_REF" = "$SOURCE_CALCULATION_SHA" ]] || exit 1
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1

      - name: Checkout postprocess code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify postprocess checkout SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Verify source run provenance
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_CALCULATION_SHA: ${{ inputs.source_calculation_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$(gh run view "$SOURCE_RUN_ID" --json headSha,status,conclusion)"
          test "$(echo "$payload" | jq -r .status)" = completed
          test "$(echo "$payload" | jq -r .conclusion)" = success
          test "$(echo "$payload" | jq -r .headSha)" = "$SOURCE_CALCULATION_SHA"

      - name: Download source numerical artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ inputs.source_run_id }}" --pattern 'cep-hybrid-production-shadow-*' --dir source-artifacts

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fixed plotting dependency
        run: python -m pip install matplotlib==3.9.2

      - name: Replay collector and plots
        shell: bash
        env:
          SCOPE: ${{ inputs.scope }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python scripts/analysis/collect_pnjl_cep_hybrid_production_shadow.py \
            --input-dir source-artifacts \
            --output-dir aggregate \
            --run-id "${{ inputs.source_run_id }}" \
            --source-run-id "${{ inputs.source_run_id }}" \
            --postprocess-sha "${GITHUB_SHA}" \
            --expected-calculation-sha "${{ inputs.source_calculation_sha }}" \
            --scope "$SCOPE" \
            --legacy-replay
          status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi
          python scripts/analysis/plot_pnjl_cep_hybrid_production_shadow.py \
            --input-dir aggregate \
            --output-dir aggregate/figures
          echo "collector_verdict_status=$status" >> "$GITHUB_STEP_SUMMARY"
          cat aggregate/manifest.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload replay aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: cep-hybrid-production-shadow-${{ inputs.tag }}-aggregate-replay
          path: aggregate
          if-no-files-found: error
          retention-days: 90
