name: PNJL Maxwell endpoint refinement

on:
  workflow_dispatch:
    inputs:
      calculation_ref:
        description: "Immutable calculation SHA"
        required: true
        type: string
      tag:
        description: "Diagnostic artifact tag"
        required: false
        default: "pnjl_maxwell_endpoint_refinement_v1"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  endpoint_refinement:
    name: "endpoint xi=-0.5 T=5"
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Validate immutable calculation ref
        shell: bash
        env:
          CALCULATION_REF: ${{ inputs.calculation_ref }}
        run: |
          [[ "$CALCULATION_REF" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "calculation_ref must be a 40-character immutable SHA" >&2
            exit 1
          }

      - name: Checkout workflow and postprocess SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify workflow checkout SHA
        shell: bash
        env:
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$WORKFLOW_HEAD_SHA"

      - name: Materialize calculation SHA worktree
        shell: bash
        env:
          CALCULATION_REF: ${{ inputs.calculation_ref }}
        run: |
          git fetch --no-tags origin "$CALCULATION_REF" --depth=1
          git worktree add --detach calculation "$CALCULATION_REF"
          test "$(git -C calculation rev-parse HEAD)" = "$CALCULATION_REF"
          cp scripts/analysis/pnjl_maxwell_endpoint_refinement.jl calculation/scripts/analysis/
          cp scripts/analysis/pnjl_maxwell_endpoint_candidate_feasibility.jl calculation/scripts/analysis/

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.5"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2
        with:
          cache-name: julia-cache-pnjl-maxwell-endpoint-v1

      - name: Install calculation dependencies
        run: julia --project=calculation -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Run endpoint refinement anchor
        shell: bash
        env:
          CALCULATION_REF: ${{ inputs.calculation_ref }}
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p artifacts/endpoint
          julia --project=calculation calculation/scripts/analysis/pnjl_maxwell_endpoint_refinement.jl \
            --calculation-sha "$CALCULATION_REF" \
            --workflow-head-sha "$WORKFLOW_HEAD_SHA" \
            --tag "$TAG" \
            --output-dir "$GITHUB_WORKSPACE/artifacts/endpoint"

      - name: Upload endpoint refinement artifact
        uses: actions/upload-artifact@v4
        with:
          name: pnjl-maxwell-endpoint-refinement-${{ inputs.tag }}
          path: artifacts/endpoint
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: aggregate endpoint evidence
    if: ${{ always() }}
    needs: [endpoint_refinement]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow and postprocess SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify workflow checkout SHA
        shell: bash
        env:
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$WORKFLOW_HEAD_SHA"

      - name: Download endpoint artifact
        uses: actions/download-artifact@v4
        with:
          pattern: pnjl-maxwell-endpoint-refinement-*
          path: job-artifacts
          merge-multiple: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect endpoint evidence
        shell: bash
        env:
          CALCULATION_REF: ${{ inputs.calculation_ref }}
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
        run: |
          python scripts/analysis/collect_pnjl_maxwell_endpoint_refinement.py \
            --input-dir "job-artifacts/pnjl-maxwell-endpoint-refinement-${{ inputs.tag }}" \
            --output-dir aggregate \
            --calculation-sha "$CALCULATION_REF" \
            --workflow-head-sha "$WORKFLOW_HEAD_SHA"
          cat aggregate/endpoint_refinement_summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate endpoint evidence
        uses: actions/upload-artifact@v4
        with:
          name: pnjl-maxwell-endpoint-refinement-${{ inputs.tag }}-aggregate
          path: aggregate
          if-no-files-found: error
          retention-days: 90
