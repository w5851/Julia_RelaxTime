name: Relaxtime Phase-Guided Transport Production
run-name: transport ${{ inputs.case_name }} / ${{ inputs.shard_label }} / ${{ inputs.run_tier }}

on:
  workflow_dispatch:
    inputs:
      calculation_sha:
        description: "Full calculation commit; empty uses the workflow commit"
        required: false
        default: ""
        type: string
      case_name:
        description: "New result case name"
        required: true
        default: "thermal_weighted_v1_preview"
        type: string
      shard_label:
        description: "Unique label within this case"
        required: true
        default: "preview"
        type: string
      sampling_profile:
        description: "Versioned background, A, tau and terminal quadrature"
        required: true
        default: "thermal_weighted_v1"
        type: choice
        options: [thermal_weighted_v1]
      mode:
        description: "Phase-guided scan mode"
        required: true
        default: "fixed-muB-phase-scaled"
        type: choice
        options: [fixed-muB-phase-scaled, fixed-T-sparse-muB]
      xi_list:
        description: "Comma-separated xi values for this shard"
        required: true
        default: "-0.5,0,0.5"
        type: string
      muB_list:
        description: "Comma-separated muB values in MeV"
        required: true
        default: "0"
        type: string
      alpha_t_list:
        description: "Mode A: T / T_phase values"
        required: true
        default: "1.0"
        type: string
      t_list:
        description: "Mode B: temperatures in MeV"
        required: true
        default: "200"
        type: string
      run_tier:
        description: "Pilot and production points use the same numerical profile"
        required: true
        default: "dry-run"
        type: choice
        options: [dry-run, production]
      render_plots:
        description: "Render raw review figures after successful numerical checks"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      JULIA_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      CASE_NAME: ${{ inputs.case_name }}
      SHARD_LABEL: ${{ inputs.shard_label }}
      CALCULATION_SHA: ${{ inputs.calculation_sha || github.sha }}
      SAMPLING_PROFILE: ${{ inputs.sampling_profile }}
      SCAN_MODE: ${{ inputs.mode }}
      XI_LIST: ${{ inputs.xi_list }}
      MUB_LIST: ${{ inputs.muB_list }}
      ALPHA_T_LIST: ${{ inputs.alpha_t_list }}
      T_LIST: ${{ inputs.t_list }}
      RUN_TIER: ${{ inputs.run_tier }}

    steps:
      - name: Checkout exact calculation source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.calculation_sha || github.sha }}

      - name: Check calculation identity
        id: calculation_identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CALCULATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$CALCULATION_SHA" ]]
          [[ "$CASE_NAME" =~ ^[A-Za-z0-9_.=-]+$ ]]
          [[ "$CASE_NAME" != . && "$CASE_NAME" != .. ]]
          [[ "$SHARD_LABEL" =~ ^[A-Za-z0-9_.=-]+$ ]]
          test -f "config/models/pnjl/transport_sampling/${SAMPLING_PROFILE}.toml"
          printf 'inputs_valid=true\n' >> "$GITHUB_OUTPUT"

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.5"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2
        with:
          cache-name: julia-cache-relaxtime-thermal-weighted-v1

      - name: Install Julia dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Run validated sampling profile
        shell: bash
        run: |
          set -euo pipefail
          audit_root="data/outputs/artifacts/relaxtime_phase_guided_transport/${{ github.run_id }}"
          mkdir -p "$audit_root"
          args=(--mode "$SCAN_MODE" --case-name "$CASE_NAME"
            --sampling-profile "$SAMPLING_PROFILE" --xi-list "$XI_LIST"
            --muB-list "$MUB_LIST" --channel-diagnostics)
          if [[ "$SCAN_MODE" == "fixed-muB-phase-scaled" ]]; then
            args+=(--alphaT-list "$ALPHA_T_LIST")
            mode_dir="mode_a_fixed_muB_phase_scaled"
          else
            args+=(--T-list "$T_LIST")
            mode_dir="mode_b_fixed_T_sparse_muB"
          fi
          [[ "$RUN_TIER" != "dry-run" ]] || args+=(--dry-run)
          result_dir="data/outputs/results/relaxtime/transport/phase_guided/${mode_dir}/${CASE_NAME}"
          export TRANSPORT_RUNNER_TIMING_PATH="$audit_root/runtime_timing.toml"
          cmd=(julia --startup-file=no --project=. --heap-size-hint=1200M benchmark/relaxtime/transport_runner_timing.jl)
          cmd+=("${args[@]}")
          printf '%q ' "${cmd[@]}" > "$audit_root/command.txt"
          printf '\n' >> "$audit_root/command.txt"
          /usr/bin/time -v -o "$audit_root/process_time.txt" "${cmd[@]}" 2>&1 | tee "$audit_root/scan.log"
          python scripts/relaxtime/check_transport_production_artifact.py "$result_dir" --profile "config/models/pnjl/transport_sampling/${SAMPLING_PROFILE}.toml" --calculation-sha "$CALCULATION_SHA" --tier "$RUN_TIER"
          printf 'RESULT_DIR=%s\n' "$result_dir" >> "$GITHUB_ENV"

      - name: Render review plots
        if: ${{ inputs.render_plots && inputs.run_tier == 'production' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install numpy pandas matplotlib
          julia --startup-file=no --project=. scripts/relaxtime/run_phase_guided_transport_plots.jl --case-dir "$RESULT_DIR"

      - name: Upload results and diagnostics
        if: ${{ always() && steps.calculation_identity.outputs.inputs_valid == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: transport-${{ inputs.case_name }}-${{ inputs.shard_label }}
          path: |
            data/outputs/results/relaxtime/transport/phase_guided/**/${{ inputs.case_name }}/**
            data/outputs/figures/relaxtime/transport/phase_guided/**/${{ inputs.case_name }}/**
            data/outputs/artifacts/relaxtime_phase_guided_transport/${{ github.run_id }}/**
          retention-days: 30
          if-no-files-found: warn

      - name: Report run scope
        if: ${{ always() }}
        shell: bash
        run: |
          {
            printf 'Calculation commit: %s\n\n' "$CALCULATION_SHA"
            printf 'Sampling profile: %s; shard: %s; tier: %s.\n\n' "$SAMPLING_PROFILE" "$SHARD_LABEL" "$RUN_TIER"
            printf 'Artifacts retain raw points, failed points, channel budgets, actual configuration, runtime/JIT timing and process peak RSS.\n'
            printf 'Import into canonical data and paper use are separate from this artifact run.\n'
          } >> "$GITHUB_STEP_SUMMARY"
