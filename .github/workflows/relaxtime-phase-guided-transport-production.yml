name: Ward Moller Mott local windows
run-name: Ward Moller Mott local windows - ${{ inputs.case_name }}
on:
  workflow_dispatch:
    inputs:
      case_name:
        description: "Unique case name for the local windows"
        required: true
        type: string
permissions:
  contents: read
env:
  JULIA_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  JULIA_PKG_PRECOMPILE_AUTO: "0"
  CORE: 096199b96d34045bf8e2d9611c2d786d6f92fb8e
  DRIVER: scripts/analysis/relaxtime/run_ward_moller_mott_response.jl
jobs:
  centers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/analysis/relaxtime
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CORE }}
          path: core
          sparse-checkout: |
            src
            scripts/relaxtime
            config
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.5"
      - uses: julia-actions/cache@v2
        with:
          cache-name: julia-cache-relaxtime-frozen-ward-v1
      - name: Locate the three thresholds
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE"
          julia --project=core -e 'using Pkg; Pkg.instantiate()'
          julia --project=core --startup-file=no --heap-size-hint=1600M "$DRIVER" core results locate 2>&1 | tee centers.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mott-centers
          path: |
            results/center_*.json
            results/*_scout.csv
            centers.log
  scan:
    needs: centers
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 27
      matrix:
        meson: [pi, K, sigma]
        slot: [1,2,3,4,5,6,7,8,9]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/analysis/relaxtime
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CORE }}
          path: core
          sparse-checkout: |
            src
            scripts/relaxtime
            config
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.5"
      - uses: julia-actions/cache@v2
        with:
          cache-name: julia-cache-relaxtime-frozen-ward-v1
      - uses: actions/download-artifact@v4
        with:
          name: mott-centers
          path: centers
      - name: Sample the local slopes
        env:
          MESON: ${{ matrix.meson }}
          SLOT: ${{ matrix.slot }}
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE"
          julia --project=core -e 'using Pkg; Pkg.instantiate()'
          mkdir -p results
          cp "$(find centers -name "center_$MESON.json" -print -quit)" results/
          pids=()
          for worker in 1 2; do
            index=$((2*(SLOT-1)+worker))
            julia --project=core --startup-file=no --heap-size-hint=1600M "$DRIVER" \
              core results scan "$MESON" both "$index" 18 > "worker_$index.log" 2>&1 &
            pids+=($!)
          done
          rc=0
          for pid in "${pids[@]}"; do wait "$pid" || rc=1; done
          tail -n 10 worker_*.log
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mott-${{ matrix.meson }}-${{ matrix.slot }}
          path: |
            results/fine/
            results/reference/
            worker_*.log

