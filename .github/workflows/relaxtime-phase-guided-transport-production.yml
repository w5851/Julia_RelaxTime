name: Ward Moller Mott response recovery
run-name: Ward Moller recovery - ${{ inputs.case_name }}

on:
  workflow_dispatch:
    inputs:
      case_name:
        required: true
        type: string
      nodes:
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  JULIA_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  JULIA_PKG_PRECOMPILE_AUTO: "0"
  CORE: 096199b96d34045bf8e2d9611c2d786d6f92fb8e
  DRIVER: scripts/analysis/relaxtime/run_ward_moller_mott_response.jl
  SOURCE_RUN: "45028496140"

jobs:
  choose:
    runs-on: ubuntu-latest
    outputs:
      nodes: ${{ steps.indexes.outputs.nodes }}
    steps:
      - id: indexes
        env:
          INPUT_NODES: ${{ inputs.nodes }}
        run: |
          python - <<'PY_IN'
          import json, os
          nodes = json.loads(os.environ['INPUT_NODES'])
          assert nodes and all(row['meson'] in ('pi', 'K', 'sigma')
                             and isinstance(row['index'], int)
                             and 1 <= row['index'] <= 11 for row in nodes)
          assert len({tuple(sorted(row.items())) for row in nodes}) == len(nodes)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('nodes=' + json.dumps(nodes) + '\n')
          PY_IN
  scan:
    needs: choose
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.choose.outputs.nodes) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/analysis/relaxtime
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CORE }}
          path: core
          sparse-checkout: |
            src
            scripts/relaxtime
            config
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.5"
      - uses: julia-actions/cache@v2
        with:
          cache-name: julia-cache-relaxtime-ward-moller-mott-v1
      - uses: actions/download-artifact@v4
        with:
          name: mott-centers
          path: centers
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
      - name: Converge the missing reference node
        env:
          MESON: ${{ matrix.meson }}
          INDEX: ${{ matrix.index }}
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE"
          julia --project=core -e 'using Pkg; Pkg.instantiate()'
          mkdir -p results
          cp "$(find centers -name "center_$MESON.json" -print -quit)" results/
          julia --project=core --startup-file=no --heap-size-hint=2300M "$DRIVER" \
            core results scan "$MESON" recheck "$INDEX" 11 2>&1 | tee worker.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mott-reference-rescue-${{ matrix.meson }}-${{ matrix.index }}
          path: |
            results/reference/
            worker.log
