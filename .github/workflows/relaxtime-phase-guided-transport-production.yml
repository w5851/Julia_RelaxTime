name: Relaxtime Phase-Guided Transport Production
run-name: phase-guided transport ${{ inputs.case_name || 'first_canonical_v1_diagnostic' }} / ${{ inputs.shard_label || 'full' }} / ${{ inputs.mode || 'both' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "phase-guided mode: fixed-muB-phase-scaled, fixed-T-sparse-muB, or both"
        required: false
        default: "both"
        type: choice
        options:
          - fixed-muB-phase-scaled
          - fixed-T-sparse-muB
          - both
      case_name:
        description: "case directory name under data/outputs/results/relaxtime/transport/phase_guided"
        required: false
        default: "first_canonical_v1_diagnostic"
        type: string
      shard_label:
        description: "short artifact label for a sharded run"
        required: false
        default: "full"
        type: string
      xi_list:
        description: "comma-separated xi values for this shard"
        required: false
        default: "-0.5,-0.45,-0.4,-0.35,-0.3,-0.25,-0.2,-0.15,-0.1,-0.05,0.0,0.05,0.1,0.15,0.2,0.25,0.3,0.35,0.4,0.45,0.5"
        type: string
      muB_list:
        description: "comma-separated muB values in MeV for this shard"
        required: false
        default: "0,450,900"
        type: string
      alpha_t_list:
        description: "comma-separated alpha_T values for fixed-muB-phase-scaled shards"
        required: false
        default: "1.0,1.1,1.2"
        type: string
      t_list:
        description: "comma-separated T values in MeV for fixed-T-sparse-muB shards"
        required: false
        default: "120,160,200"
        type: string
      run_tier:
        description: "diagnostic run tier"
        required: false
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - smoke
          - production
      propagator_xi_policy:
        description: "sigma(s)/propagator xi policy"
        required: false
        default: "match_thermo"
        type: choice
        options:
          - match_thermo
          - isotropic
      sigma_cache_policy:
        description: "sigma(s) cache policy"
        required: false
        default: "validated_anchored"
        type: choice
        options:
          - default
          - validated_anchored
      tau_p_nodes:
        description: "Tau momentum nodes for production tier"
        required: false
        default: "128"
        type: string
      tau_angle_nodes:
        description: "Tau cos(theta) nodes for production tier"
        required: false
        default: "20"
        type: string
      tau_phi_nodes:
        description: "Tau phi nodes for production tier"
        required: false
        default: "36"
        type: string
      tau_n_sigma:
        description: "Tau sigma integral points for production tier"
        required: false
        default: "24"
        type: string
      sigma_grid_n:
        description: "Tau sigma cache grid size for production tier"
        required: false
        default: "560"
        type: string
      compute_bulk:
        description: "Compute zeta-related outputs"
        required: false
        default: true
        type: boolean
      render_plots:
        description: "Render phase-guided figures after a non-dry-run scan"
        required: false
        default: true
        type: boolean
      overwrite:
        description: "Overwrite existing outputs in the runner workspace"
        required: false
        default: true
        type: boolean

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ARTIFACT_RETENTION_DAYS: "30"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.5"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2
        with:
          cache-name: julia-cache-relaxtime-phase-guided-transport

      - name: Install Julia dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Install Python plotting dependencies
        if: ${{ inputs.render_plots == true && inputs.run_tier != 'dry-run' }}
        run: python -m pip install numpy pandas matplotlib

      - name: Run phase-guided transport artifact producer
        shell: bash
        run: |
          set -euo pipefail

          case_name="${{ inputs.case_name || 'first_canonical_v1_diagnostic' }}"
          shard_label="${{ inputs.shard_label || 'full' }}"
          run_tier="${{ inputs.run_tier || 'dry-run' }}"
          policy="${{ inputs.propagator_xi_policy || 'match_thermo' }}"
          sigma_cache_policy="${{ inputs.sigma_cache_policy || 'validated_anchored' }}"
          render_plots="${{ inputs.render_plots }}"
          mode_input="${{ inputs.mode || 'both' }}"
          xi_list="${{ inputs.xi_list || '-0.5,-0.45,-0.4,-0.35,-0.3,-0.25,-0.2,-0.15,-0.1,-0.05,0.0,0.05,0.1,0.15,0.2,0.25,0.3,0.35,0.4,0.45,0.5' }}"
          muB_list="${{ inputs.muB_list || '0,450,900' }}"
          alpha_t_list="${{ inputs.alpha_t_list || '1.0,1.1,1.2' }}"
          t_list="${{ inputs.t_list || '120,160,200' }}"
          audit_root="data/outputs/artifacts/relaxtime_phase_guided_transport/${{ github.run_id }}"
          log_root="$audit_root/logs"
          safe_shard_label="$(printf '%s' "$shard_label" | sed 's/[^A-Za-z0-9_.=-]/_/g')"
          mkdir -p "$log_root"

          if [[ ! "$case_name" =~ ^[A-Za-z0-9_.=-]+$ ]]; then
            echo "::error::case_name contains unsupported characters: $case_name"
            exit 2
          fi
          if [[ ! "$shard_label" =~ ^[A-Za-z0-9_.=-]+$ ]]; then
            echo "::error::shard_label contains unsupported characters: $shard_label"
            exit 2
          fi

          modes=()
          if [ "$mode_input" = "both" ]; then
            modes=("fixed-muB-phase-scaled" "fixed-T-sparse-muB")
          else
            modes=("$mode_input")
          fi

          common_args=(
            --case-name "$case_name"
            --propagator-xi-policy "$policy"
            --sigma-cache-policy "$sigma_cache_policy"
            --channel-diagnostics
          )

          if [ "$run_tier" = "smoke" ]; then
            common_args+=(
              --tau-p-nodes 6
              --tau-angle-nodes 2
              --tau-phi-nodes 2
              --tau-n-sigma 4
              --sigma-grid-n 12
            )
          else
            common_args+=(
              --tau-p-nodes "${{ inputs.tau_p_nodes || '128' }}"
              --tau-angle-nodes "${{ inputs.tau_angle_nodes || '20' }}"
              --tau-phi-nodes "${{ inputs.tau_phi_nodes || '36' }}"
              --tau-n-sigma "${{ inputs.tau_n_sigma || '24' }}"
              --sigma-grid-n "${{ inputs.sigma_grid_n || '560' }}"
            )
          fi

          if [ "${{ inputs.compute_bulk }}" != "true" ]; then
            common_args+=(--no-compute-bulk)
          fi
          if [ "${{ inputs.overwrite }}" = "true" ]; then
            common_args+=(--overwrite)
          fi
          if [ "$run_tier" = "dry-run" ]; then
            common_args+=(--dry-run)
          fi

          for mode in "${modes[@]}"; do
            if [ "$mode" = "fixed-muB-phase-scaled" ]; then
              scan_args=(
                --mode fixed-muB-phase-scaled
                --muB-list "$muB_list"
                --alphaT-list "$alpha_t_list"
                --xi-list "$xi_list"
              )
              if [ "$run_tier" = "smoke" ]; then
                scan_args=(
                  --mode fixed-muB-phase-scaled
                  --muB-list 0
                  --alphaT-list 1.0
                  --xi-list -0.3,0.0
                )
              fi
            elif [ "$mode" = "fixed-T-sparse-muB" ]; then
              scan_args=(
                --mode fixed-T-sparse-muB
                --muB-list "$muB_list"
                --T-list "$t_list"
                --xi-list "$xi_list"
              )
              if [ "$run_tier" = "smoke" ]; then
                scan_args=(
                  --mode fixed-T-sparse-muB
                  --muB-list 0
                  --T-list 200
                  --xi-list -0.3,0.0
                )
              fi
            else
              echo "::error::Unknown mode: $mode"
              exit 1
            fi

            scan_log="$log_root/scan_${mode}_${safe_shard_label}.log"
            {
              printf 'Running phase-guided transport scan (%s, shard=%s):\n  ' "$mode" "$shard_label"
              printf '%q ' julia --project=. scripts/relaxtime/run_phase_guided_transport_scan.jl "${scan_args[@]}" "${common_args[@]}"
              printf '\n'
              julia --project=. scripts/relaxtime/run_phase_guided_transport_scan.jl "${scan_args[@]}" "${common_args[@]}"
            } 2>&1 | tee "$scan_log"

            if [ "$run_tier" != "dry-run" ] && [ "$render_plots" = "true" ]; then
              mode_dir="mode_a_fixed_muB_phase_scaled"
              if [ "$mode" = "fixed-T-sparse-muB" ]; then
                mode_dir="mode_b_fixed_T_sparse_muB"
              fi
              case_dir="data/outputs/results/relaxtime/transport/phase_guided/${mode_dir}/${case_name}"
              plot_log="$log_root/plot_${mode}_${safe_shard_label}.log"
              {
                printf 'Rendering phase-guided transport plots (%s, shard=%s):\n  ' "$mode" "$shard_label"
                printf '%q ' julia --project=. scripts/relaxtime/run_phase_guided_transport_plots.jl --case-dir "$case_dir" --overwrite
                printf '\n'
                julia --project=. scripts/relaxtime/run_phase_guided_transport_plots.jl --case-dir "$case_dir" --overwrite
              } 2>&1 | tee "$plot_log"
            fi
          done

      - name: Write diagnostic audit note
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          case_name="${{ inputs.case_name || 'first_canonical_v1_diagnostic' }}"
          shard_label="${{ inputs.shard_label || 'full' }}"
          audit_root="data/outputs/artifacts/relaxtime_phase_guided_transport/${{ github.run_id }}"
          mkdir -p "$audit_root"
          {
            echo "# Relaxtime Phase-Guided Transport Diagnostic Audit"
            echo ""
            echo "This GitHub Actions workflow produces reviewable artifacts for phase-guided transport scans."
            echo "It does not commit, promote, or certify repository production data."
            echo ""
            echo "## Run identity"
            echo ""
            printf -- '- workflow_run_id: `%s`\n' "${{ github.run_id }}"
            printf -- '- workflow_run_attempt: `%s`\n' "${{ github.run_attempt }}"
            printf -- '- git_ref: `%s`\n' "${{ github.ref }}"
            printf -- '- git_sha: `%s`\n' "${{ github.sha }}"
            printf -- '- workflow: `%s`\n' "${{ github.workflow }}"
            echo ""
            echo "## Inputs"
            echo ""
            printf -- '- mode: `%s`\n' "${{ inputs.mode || 'both' }}"
            printf -- '- case_name: `%s`\n' "$case_name"
            printf -- '- shard_label: `%s`\n' "$shard_label"
            printf -- '- run_tier: `%s`\n' "${{ inputs.run_tier || 'dry-run' }}"
            printf -- '- propagator_xi_policy: `%s`\n' "${{ inputs.propagator_xi_policy || 'match_thermo' }}"
            printf -- '- sigma_cache_policy: `%s`\n' "${{ inputs.sigma_cache_policy || 'validated_anchored' }}"
            printf -- '- xi_list: `%s`\n' "${{ inputs.xi_list || '-0.5,-0.45,-0.4,-0.35,-0.3,-0.25,-0.2,-0.15,-0.1,-0.05,0.0,0.05,0.1,0.15,0.2,0.25,0.3,0.35,0.4,0.45,0.5' }}"
            printf -- '- muB_list: `%s`\n' "${{ inputs.muB_list || '0,450,900' }}"
            printf -- '- alpha_t_list: `%s`\n' "${{ inputs.alpha_t_list || '1.0,1.1,1.2' }}"
            printf -- '- t_list: `%s`\n' "${{ inputs.t_list || '120,160,200' }}"
            printf -- '- compute_bulk: `%s`\n' "${{ inputs.compute_bulk }}"
            printf -- '- render_plots: `%s`\n' "${{ inputs.render_plots }}"
            printf -- '- overwrite: `%s`\n' "${{ inputs.overwrite }}"
            printf -- '- tau_p_nodes: `%s`\n' "${{ inputs.tau_p_nodes || '128' }}"
            printf -- '- tau_angle_nodes: `%s`\n' "${{ inputs.tau_angle_nodes || '20' }}"
            printf -- '- tau_phi_nodes: `%s`\n' "${{ inputs.tau_phi_nodes || '36' }}"
            printf -- '- tau_n_sigma: `%s`\n' "${{ inputs.tau_n_sigma || '24' }}"
            printf -- '- sigma_grid_n: `%s`\n' "${{ inputs.sigma_grid_n || '560' }}"
            echo ""
            echo "## Verdict"
            echo ""
            echo "diagnostic-only"
            echo ""
            echo "Production-grade promotion still requires an explicit convergence gate, channel diagnostics review,"
            echo "and a separate decision to import selected artifacts into the repository data tree."
          } > "$audit_root/DIAGNOSTIC_AUDIT.md"

      - name: Upload phase-guided result artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: relaxtime-phase-guided-transport-results-${{ inputs.case_name || 'first_canonical_v1_diagnostic' }}-${{ inputs.propagator_xi_policy || 'match_thermo' }}-${{ inputs.sigma_cache_policy || 'validated_anchored' }}-${{ inputs.shard_label || 'full' }}
          path: |
            data/outputs/results/relaxtime/transport/phase_guided/**/${{ inputs.case_name || 'first_canonical_v1_diagnostic' }}/**
            data/outputs/artifacts/relaxtime_phase_guided_transport/${{ github.run_id }}/**
          retention-days: ${{ fromJson(env.ARTIFACT_RETENTION_DAYS) }}
          if-no-files-found: warn

      - name: Upload phase-guided figure artifacts
        if: ${{ always() && inputs.render_plots == true && inputs.run_tier != 'dry-run' }}
        uses: actions/upload-artifact@v4
        with:
          name: relaxtime-phase-guided-transport-figures-${{ inputs.case_name || 'first_canonical_v1_diagnostic' }}-${{ inputs.propagator_xi_policy || 'match_thermo' }}-${{ inputs.sigma_cache_policy || 'validated_anchored' }}-${{ inputs.shard_label || 'full' }}
          path: |
            data/outputs/figures/relaxtime/transport/phase_guided/**/${{ inputs.case_name || 'first_canonical_v1_diagnostic' }}/**
          retention-days: ${{ fromJson(env.ARTIFACT_RETENTION_DAYS) }}
          if-no-files-found: warn

      - name: Write summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Relaxtime Phase-Guided Transport Production"
            echo ""
            echo "- mode: \`${{ inputs.mode || 'both' }}\`"
            echo "- case_name: \`${{ inputs.case_name || 'first_canonical_v1_diagnostic' }}\`"
            echo "- shard_label: \`${{ inputs.shard_label || 'full' }}\`"
            echo "- run_tier: \`${{ inputs.run_tier || 'dry-run' }}\`"
            echo "- propagator_xi_policy: \`${{ inputs.propagator_xi_policy || 'match_thermo' }}\`"
            echo "- sigma_cache_policy: \`${{ inputs.sigma_cache_policy || 'validated_anchored' }}\`"
            echo "- compute_bulk: \`${{ inputs.compute_bulk }}\`"
            echo "- render_plots: \`${{ inputs.render_plots }}\`"
            echo "- artifact retention days: \`${ARTIFACT_RETENTION_DAYS}\`"
            echo ""
            echo "Verdict: \`diagnostic-only\` until convergence and channel diagnostics are reviewed."
          } >> "$GITHUB_STEP_SUMMARY"
