name: docs-consistency

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "config/governance/docs_authority_map.toml"
      - "scripts/dev/check_docs_consistency.jl"
      - "scripts/dev/check_sop_governance.jl"
      - "tests/unit/config/test_sop_governance.jl"
      - ".github/workflows/docs-consistency.yml"
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - "docs/**"
      - "config/governance/docs_authority_map.toml"
      - "scripts/dev/check_docs_consistency.jl"
      - "scripts/dev/check_sop_governance.jl"
      - "tests/unit/config/test_sop_governance.jl"
      - ".github/workflows/docs-consistency.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.5"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2
        with:
          cache-name: julia-cache-docs-consistency

      - name: Instantiate dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run docs consistency check
        run: julia --project=. scripts/dev/check_docs_consistency.jl

      - name: Run scientific SOP governance check
        run: julia --project=. scripts/dev/check_sop_governance.jl

      - name: Run SOP governance unit test
        run: julia --project=. tests/unit/config/test_sop_governance.jl
