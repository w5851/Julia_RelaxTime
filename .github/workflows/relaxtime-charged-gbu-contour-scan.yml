name: Charged GBU contour scan

on:
  workflow_dispatch:
    inputs:
      t_grid:
        description: "T grid start:stop:step in MeV"
        required: false
        default: "40:220:10"
        type: string
      muB_grid:
        description: "muB grid start:stop:step in MeV"
        required: false
        default: "0:800:50"
        type: string
      channels:
        description: "Comma-separated charged channels"
        required: false
        default: "pi_plus,K_plus,pi_minus,K_minus"
        type: string
      shard_count:
        description: "Number of parallel T-row shards"
        required: false
        default: "4"
        type: string
      output_tag:
        description: "Artifact tag"
        required: false
        default: "diagnostic"
        type: string
      replot_run_id:
        description: "Optional source run: replot frozen shards without any numerical scan"
        required: false
        default: ""
        type: string
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      shard_count: ${{ steps.plan.outputs.shard_count }}
      shard_ids: ${{ steps.plan.outputs.shard_ids }}
    steps:
      - id: plan
        shell: bash
        env:
          SHARD_COUNT: ${{ inputs.shard_count || '4' }}
        run: |
          set -euo pipefail
          [[ "${SHARD_COUNT}" =~ ^[1-9][0-9]*$ ]] || { echo "shard_count must be positive" >&2; exit 2; }
          ids=$(python - <<'PY'
          import os
          n=int(os.environ['SHARD_COUNT'])
          print(','.join(str(i) for i in range(n)))
          PY
          )
          echo "shard_count=${SHARD_COUNT}" >> "$GITHUB_OUTPUT"
          echo "shard_ids=[${ids}]" >> "$GITHUB_OUTPUT"

  scan:
    needs: prepare
    if: ${{ inputs.replot_run_id == '' }}
    strategy:
      fail-fast: false
      matrix:
        shard_index: ${{ fromJSON(needs.prepare.outputs.shard_ids) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.5"
      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2
        with:
          cache-name: julia-cache-charged-gbu-contour-scan
      - name: Instantiate and precompile
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: Run diagnostic shard
        env:
          T_GRID: ${{ inputs.t_grid || '40:220:10' }}
          MUB_GRID: ${{ inputs.muB_grid || '0:800:50' }}
          CHANNELS: ${{ inputs.channels || 'pi_plus,K_plus,pi_minus,K_minus' }}
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_COUNT: ${{ needs.prepare.outputs.shard_count }}
          OUTPUT: contour-output
        run: |
          julia --project=. scripts/analysis/relaxtime/run_charged_gbu_contour_scan.jl \
            --output "$OUTPUT" --t-grid "$T_GRID" --muB-grid "$MUB_GRID" \
            --channels "$CHANNELS" --shard-index "$SHARD_INDEX" --shard-count "$SHARD_COUNT"
      - name: Upload diagnostic shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charged-gbu-contour-${{ inputs.output_tag || format('run-{0}', github.run_id) }}-shard-${{ matrix.shard_index }}
          path: contour-output
          retention-days: 30

  aggregate:
    needs: [prepare, scan]
    if: ${{ always() && needs.prepare.result == 'success' && (inputs.replot_run_id != '' || needs.scan.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Download diagnostic shards
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.replot_run_id && 'charged-gbu-contour-*-shard-*' || format('charged-gbu-contour-{0}-shard-*', inputs.output_tag || format('run-{0}', github.run_id)) }}
          path: contour-shards
          merge-multiple: false
          run-id: ${{ inputs.replot_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install plotting dependencies
        run: python -m pip install matplotlib==3.9.2
      - name: Render screening heatmaps, labeled contours, and masks
        env:
          SOURCE_RUN_ID: ${{ inputs.replot_run_id || github.run_id }}
          SOURCE_GIT_SHA: ${{ github.sha }}
          POSTPROCESS_RUN_ID: ${{ github.run_id }}
        run: |
          python scripts/analysis/relaxtime/plot_charged_gbu_contour_screening.py \
            --input-root contour-shards \
            --output-dir contour-plots \
            --source-run-id "$SOURCE_RUN_ID" \
            --postprocess-run-id "$POSTPROCESS_RUN_ID" \
            --git-sha "$SOURCE_GIT_SHA"
      - name: Select sparse full-gate candidates
        env:
          SOURCE_RUN_ID: ${{ inputs.replot_run_id || github.run_id }}
        run: |
          source_sha=$(python -c "import json; print(json.load(open('contour-plots/plot_manifest.json'))['source_git_sha'])")
          python scripts/analysis/relaxtime/select_charged_gbu_contour_candidates.py \
            --input contour-plots/contour_points_merged.csv \
            --output-dir contour-candidates \
            --source-run-id "$SOURCE_RUN_ID" \
            --git-sha "$source_sha"
      - name: Write aggregation note
        shell: bash
        run: |
          set -euo pipefail
          find contour-shards -name manifest.json -print | sort > contour-shards/manifests.txt
          test -s contour-shards/manifests.txt
          echo "Diagnostic-only: heatmaps use exact grid values; contours interpolate only inside four-valid-corner cells, never across masks. No smoothing or zero-filled failures." > contour-shards/aggregation_note.txt
      - name: Upload shard index
        uses: actions/upload-artifact@v4
        with:
          name: charged-gbu-contour-${{ inputs.output_tag || format('run-{0}', github.run_id) }}-index
          path: contour-shards
          retention-days: 30
      - name: Upload screening plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charged-gbu-contour-${{ inputs.output_tag || format('run-{0}', github.run_id) }}-plots
          path: contour-plots
          if-no-files-found: warn
          retention-days: 30
      - name: Upload sparse candidate manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charged-gbu-contour-${{ inputs.output_tag || format('run-{0}', github.run_id) }}-candidates
          path: contour-candidates
          if-no-files-found: warn
          retention-days: 30
