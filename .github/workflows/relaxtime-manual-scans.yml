name: Relaxtime Manual Scans

on:
  workflow_dispatch:
    inputs:
      sections:
        description: "Outputs to generate: all, cross_section, plan_a, or plan_b"
        required: false
        default: "all"
        type: string
      sampling_profile:
        description: "Versioned background, A, tau and terminal quadrature"
        required: false
        default: "thermal_weighted_v1"
        type: choice
        options: [thermal_weighted_v1]
      compute_bulk:
        description: "Compute zeta-related outputs"
        required: false
        default: true
        type: boolean
      overwrite:
        description: "Overwrite existing outputs"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      JULIA_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      SECTIONS: ${{ inputs.sections || 'all' }}
      SAMPLING_PROFILE: ${{ inputs.sampling_profile || 'thermal_weighted_v1' }}
      COMPUTE_BULK: ${{ inputs.compute_bulk }}
      OVERWRITE: ${{ inputs.overwrite }}
      OUTPUT_ROOT: data/outputs/artifacts/relaxtime_manual_scans/${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.5"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2
        with:
          cache-name: julia-cache-relaxtime-manual-scans

      - name: Install Julia dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Install Python plotting dependencies
        run: python -m pip install numpy pandas matplotlib

      - name: Run manual relaxtime workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_ROOT"
          args=(--sections "$SECTIONS" --sampling-profile "$SAMPLING_PROFILE"
            --base-output-dir "$OUTPUT_ROOT")
          [[ "$COMPUTE_BULK" == "true" ]] || args+=(--no-bulk)
          [[ "$OVERWRITE" != "true" ]] || args+=(--overwrite)
          cmd=(julia --startup-file=no --project=. --heap-size-hint=1200M
            scripts/relaxtime/run_manual_relaxation_scan_workflow.jl)
          cmd+=("${args[@]}")
          printf '%q ' "${cmd[@]}" > "$OUTPUT_ROOT/command.txt"
          printf '\n' >> "$OUTPUT_ROOT/command.txt"
          /usr/bin/time -v -o "$OUTPUT_ROOT/process_time.txt" "${cmd[@]}" 2>&1 | tee "$OUTPUT_ROOT/scan.log"

      - name: Upload result artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: relaxtime-manual-scan-results
          path: |
            data/outputs/artifacts/relaxtime_manual_scans/${{ github.run_id }}/results/**
            data/outputs/artifacts/relaxtime_manual_scans/${{ github.run_id }}/command.txt
            data/outputs/artifacts/relaxtime_manual_scans/${{ github.run_id }}/process_time.txt
            data/outputs/artifacts/relaxtime_manual_scans/${{ github.run_id }}/scan.log
          retention-days: 30
          if-no-files-found: warn

      - name: Upload figure artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: relaxtime-manual-scan-figures
          path: |
            data/outputs/artifacts/relaxtime_manual_scans/${{ github.run_id }}/figures/**
          retention-days: 30
          if-no-files-found: warn

      - name: Write summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            printf 'Manual scan sections: %s\n\n' "$SECTIONS"
            printf 'Sampling profile: %s; bulk: %s; overwrite: %s.\n\n' "$SAMPLING_PROFILE" "$COMPUTE_BULK" "$OVERWRITE"
            printf 'Output: %s. Process timing and failed-point evidence accompany the results.\n' "$OUTPUT_ROOT"
          } >> "$GITHUB_STEP_SUMMARY"
