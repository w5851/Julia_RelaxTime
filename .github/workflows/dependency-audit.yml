name: Dependency Audit

on:
  pull_request:
  push:
    paths:
      - "src/**"
      - "scripts/dev/**"
      - "docs/architecture/**"
      - "Project.toml"
      - "Manifest.toml"
      - "package.json"
      - "package-lock.json"

jobs:
  deps-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.5"

      - name: Generate dependency graph
        run: julia --project=. scripts/dev/gen_deps.jl

      - name: Run dependency audit (strict)
        env:
          DEPS_STRICT: "1"
        run: julia --project=. scripts/dev/analyze_deps.jl

      - name: Check precompile profile coverage
        run: julia --project=. scripts/dev/check_precompile_profile_coverage.jl
