name: PNJL Issue130 Crossover Mu Endpoint Pilot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "numerical matrix or aggregate-only replay"
        required: false
        default: numerical
        type: choice
        options:
          - numerical
          - aggregate_replay
      calculation_ref:
        description: "immutable calculation SHA"
        required: true
        type: string
      tag:
        description: "versioned diagnostic artifact tag"
        required: true
        default: issue130_crossover_mu_endpoint_pilot_v1
        type: string
      source_run_id:
        description: "completed numerical run for aggregate replay"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

env:
  TARGET_LIST: docs/analysis/pnjl/issue130_endpoint_refinement_preflight_v1/crossover_mu/tables/target_list.csv

jobs:
  numerical:
    if: ${{ inputs.mode == 'numerical' }}
    name: "crossover endpoint ${{ matrix.target_id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        target_id:
          - crossover_xi_m0p5_fraction_1
          - crossover_xi_m0p5_fraction_2
          - crossover_xi_0_fraction_1
          - crossover_xi_0_fraction_2
          - crossover_xi_0p2875_fraction_1
          - crossover_xi_0p2875_fraction_2
          - crossover_xi_0p5_fraction_1
          - crossover_xi_0p5_fraction_2
    env:
      CALCULATION_SHA: ${{ inputs.calculation_ref }}
      WORKFLOW_HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Validate immutable calculation ref
        shell: bash
        run: |
          [[ "$CALCULATION_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "calculation_ref must be a 40-character immutable SHA" >&2
            exit 1
          }

      - name: Checkout workflow and postprocess head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify workflow checkout SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$WORKFLOW_HEAD_SHA"

      - name: Materialize calculation worktree
        shell: bash
        run: |
          git fetch --no-tags origin "$CALCULATION_SHA" --depth=1
          git worktree add --detach calculation "$CALCULATION_SHA"
          test "$(git -C calculation rev-parse HEAD)" = "$CALCULATION_SHA"
          mkdir -p calculation/scripts/analysis calculation/endpoint_inputs
          cp scripts/analysis/pnjl_issue130_crossover_mu_endpoint_pilot.jl calculation/scripts/analysis/
          cp "$TARGET_LIST" calculation/endpoint_inputs/target_list.csv

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.5"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2
        with:
          cache-name: julia-cache-issue130-crossover-endpoint-v1

      - name: Install calculation dependencies
        run: julia --project=calculation -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Run one crossover endpoint target
        shell: bash
        env:
          TARGET_ID: ${{ matrix.target_id }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "artifacts/${TARGET_ID}"
          julia --project=calculation calculation/scripts/analysis/pnjl_issue130_crossover_mu_endpoint_pilot.jl \
            --calculation-sha "$CALCULATION_SHA" \
            --workflow-head-sha "$WORKFLOW_HEAD_SHA" \
            --target-id "$TARGET_ID" \
            --target-list calculation/endpoint_inputs/target_list.csv \
            --tag "$TAG" \
            --output-dir "artifacts/${TARGET_ID}"

      - name: Upload numerical target artifact
        uses: actions/upload-artifact@v4
        with:
          name: issue130-crossover-mu-endpoint-${{ matrix.target_id }}-${{ inputs.tag }}
          path: artifacts/${{ matrix.target_id }}
          if-no-files-found: error
          retention-days: 90

  aggregate:
    if: ${{ always() && inputs.mode == 'numerical' }}
    name: aggregate crossover endpoint pilot
    needs: [numerical]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow and postprocess head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download numerical target artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: issue130-crossover-mu-endpoint-*-${{ inputs.tag }}
          path: target-artifacts
          merge-multiple: false

      - name: Validate and aggregate endpoint evidence
        shell: bash
        env:
          CALCULATION_SHA: ${{ inputs.calculation_ref }}
          POSTPROCESS_SHA: ${{ github.sha }}
        run: |
          set +e
          python scripts/analysis/collect_pnjl_issue130_crossover_mu_endpoint_pilot.py \
            --input-dir target-artifacts \
            --output-dir aggregate \
            --target-list "$TARGET_LIST" \
            --calculation-sha "$CALCULATION_SHA" \
            --postprocess-sha "$POSTPROCESS_SHA" \
            --run-mode numerical
          status=$?
          cat aggregate/verdict.json >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi

      - name: Upload aggregate endpoint evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue130-crossover-mu-endpoint-${{ inputs.tag }}-aggregate
          path: aggregate
          if-no-files-found: error
          retention-days: 90

  aggregate_replay:
    if: ${{ inputs.mode == 'aggregate_replay' }}
    name: replay crossover endpoint aggregate
    runs-on: ubuntu-latest
    steps:
      - name: Validate replay inputs
        shell: bash
        env:
          CALCULATION_SHA: ${{ inputs.calculation_ref }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          [[ "$CALCULATION_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1

      - name: Checkout workflow and postprocess head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download source numerical artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: issue130-crossover-mu-endpoint-*-${{ inputs.tag }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: target-artifacts
          merge-multiple: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Replay and validate aggregate
        shell: bash
        env:
          CALCULATION_SHA: ${{ inputs.calculation_ref }}
          POSTPROCESS_SHA: ${{ github.sha }}
        run: |
          set +e
          python scripts/analysis/collect_pnjl_issue130_crossover_mu_endpoint_pilot.py \
            --input-dir target-artifacts \
            --output-dir aggregate \
            --target-list "$TARGET_LIST" \
            --calculation-sha "$CALCULATION_SHA" \
            --postprocess-sha "$POSTPROCESS_SHA" \
            --run-mode aggregate_replay \
            --source-run-id "${{ inputs.source_run_id }}"
          status=$?
          cat aggregate/verdict.json >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi

      - name: Upload replay aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue130-crossover-mu-endpoint-${{ inputs.tag }}-replay-aggregate
          path: aggregate
          if-no-files-found: error
          retention-days: 90
