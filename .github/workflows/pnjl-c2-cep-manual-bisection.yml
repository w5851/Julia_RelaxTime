name: PNJL C2 CEP Manual Bisection Diagnostic

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Numerical low/mid/high slices or aggregate replay"
        required: true
        default: numerical
        type: choice
        options: [numerical, aggregate_replay]
      calculation_ref:
        description: "Immutable calculation SHA"
        required: true
        default: 3c5f6b3c9bd535cff7657364dadb2efc31f2ea48
        type: string
      source_run_id:
        description: "Completed numerical source run for replay"
        required: false
        default: ""
        type: string
      source_calculation_sha:
        description: "Source calculation SHA; must match calculation_ref"
        required: false
        default: ""
        type: string
      source_postprocess_sha:
        description: "Source numerical runner/postprocess SHA"
        required: false
        default: ""
        type: string
      tag:
        description: "Immutable diagnostic tag"
        required: true
        default: issue130_c2_cep_manual_bisection_v1_20260817
        type: string

permissions:
  contents: read
  actions: read

env:
  CALCULATION_SHA: 3c5f6b3c9bd535cff7657364dadb2efc31f2ea48
  PLAN_SHA256: 56ed6bb87b9b18098ab7a95aeac6d7a5d6ddade9ec1f240243d470749a1f25b1
  WORKFLOW_SCHEMA: pnjl_c2_cep_manual_bisection_v1
  TARGET_XI: 0.125,0.39375,0.5

jobs:
  numerical:
    if: ${{ inputs.run_mode == 'numerical' }}
    name: "C2 manual CEP bisection xi=${{ matrix.xi }}"
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        xi: ["0.125", "0.39375", "0.5"]
    steps:
      - name: Validate immutable calculation SHA
        env:
          INPUT_SHA: ${{ inputs.calculation_ref }}
        run: |
          [[ "$INPUT_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
          [[ "${INPUT_SHA,,}" == "$CALCULATION_SHA" ]] || exit 1

      - name: Checkout workflow head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify workflow head and plan
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(sha256sum docs/analysis/pnjl/c2_followups/c2_manual_bisection_v1/temperature_plan.csv | awk '{print $1}')" = "$PLAN_SHA256"

      - name: Materialize calculation checkout and runner
        env:
          CALCULATION_REF: ${{ inputs.calculation_ref }}
        shell: bash
        run: |
          git fetch --no-tags origin "$CALCULATION_REF" --depth=1
          git worktree add --detach calculation "$CALCULATION_REF"
          test "$(git -C calculation rev-parse HEAD)" = "$CALCULATION_REF"
          cp scripts/analysis/pnjl_c2_cep_manual_bisection_job.jl calculation/scripts/analysis/
          cp scripts/analysis/pnjl_c2_cep_limited_feasibility_job.jl calculation/scripts/analysis/
          mkdir -p calculation/docs/analysis/pnjl/c2_followups/c2_manual_bisection_v1
          cp docs/analysis/pnjl/c2_followups/c2_manual_bisection_v1/temperature_plan.csv calculation/docs/analysis/pnjl/c2_followups/c2_manual_bisection_v1/
          test "$(sha256sum calculation/docs/analysis/pnjl/c2_followups/c2_manual_bisection_v1/temperature_plan.csv | awk '{print $1}')" = "$PLAN_SHA256"

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.5"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2
        with:
          cache-name: julia-cache-c2-cep-manual-bisection-v1

      - name: Install calculation dependencies
        working-directory: calculation
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Run fixed low/mid/high numerical slices
        env:
          XI: ${{ matrix.xi }}
          TAG: ${{ inputs.tag }}
          CALCULATION_REF: ${{ inputs.calculation_ref }}
          POSTPROCESS_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          mkdir -p "artifacts/xi_${XI}"
          cd calculation
          julia --project=. scripts/analysis/pnjl_c2_cep_manual_bisection_job.jl \
            --scope cep --xi "$XI" --tag "$TAG" \
            --calculation-sha "$CALCULATION_REF" \
            --postprocess-sha "$POSTPROCESS_SHA" \
            --source-run-id "$SOURCE_RUN_ID" \
            --plan-file "docs/analysis/pnjl/c2_followups/c2_manual_bisection_v1/temperature_plan.csv" \
            --output-dir "../artifacts/xi_${XI}"

      - name: Upload manual bisection numerical artifact
        uses: actions/upload-artifact@v4
        with:
          name: c2-cep-manual-bisection-xi-${{ matrix.xi }}
          path: artifacts/xi_${{ matrix.xi }}
          if-no-files-found: error
          retention-days: 90

  aggregate_replay:
    if: ${{ inputs.run_mode == 'aggregate_replay' }}
    name: C2 manual CEP bisection aggregate replay
    runs-on: ubuntu-latest
    steps:
      - name: Validate replay inputs and source run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          INPUT_SHA: ${{ inputs.calculation_ref }}
          SOURCE_SHA: ${{ inputs.source_calculation_sha }}
          SOURCE_POSTPROCESS_SHA: ${{ inputs.source_postprocess_sha }}
        shell: bash
        run: |
          [[ "$INPUT_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
          [[ "${INPUT_SHA,,}" == "$CALCULATION_SHA" ]] || exit 1
          [[ -n "$SOURCE_RUN_ID" && "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          [[ -z "$SOURCE_SHA" || "${SOURCE_SHA,,}" == "$CALCULATION_SHA" ]] || exit 1
          payload="$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,conclusion,jobs,headSha)"
          test "$(jq -r .status <<<"$payload")" = completed
          jobs="$(jq '[.jobs[] | select(.name | startswith("C2 manual CEP bisection xi="))]' <<<"$payload")"
          test "$(jq length <<<"$jobs")" = 3
          test "$(jq '[.[] | select(.conclusion != "success")] | length' <<<"$jobs")" = 0
          source_head="$(jq -r .headSha <<<"$payload")"
          [[ -z "$SOURCE_POSTPROCESS_SHA" || "$SOURCE_POSTPROCESS_SHA" == "$source_head" ]] || exit 1
          echo "SOURCE_HEAD_SHA=$source_head" >> "$GITHUB_ENV"

      - name: Checkout workflow head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify plan hash
        shell: bash
        run: test "$(sha256sum docs/analysis/pnjl/c2_followups/c2_manual_bisection_v1/temperature_plan.csv | awk '{print $1}')" = "$PLAN_SHA256"

      - name: Download exactly three source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          mkdir -p source-artifacts
          for xi in 0.125 0.39375 0.5; do
            gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "c2-cep-manual-bisection-xi-${xi}" --dir "source-artifacts/xi_${xi}"
          done

      - name: Validate and render solver-free audit package
        shell: bash
        run: |
          python -m pip install matplotlib==3.9.2
          python scripts/analysis/pnjl_c2_cep_manual_bisection.py \
            --input-dir source-artifacts --output-dir aggregate \
            --source-run-id "${{ inputs.source_run_id }}" \
            --expected-workflow-head "$SOURCE_HEAD_SHA"

      - name: Upload manual bisection audit package
        uses: actions/upload-artifact@v4
        with:
          name: c2-cep-manual-bisection-${{ inputs.tag }}-aggregate
          path: aggregate
          if-no-files-found: error
          retention-days: 90
