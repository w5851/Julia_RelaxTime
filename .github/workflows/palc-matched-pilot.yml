name: palc-matched-pilot

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Bounded workload"
        type: choice
        options: [local, long, higher, transition, production]
        default: local
      repetitions:
        description: "First call plus warm repetitions"
        default: "6"
      budget_seconds:
        description: "Production comparison numerical budget"
        default: "2700"
      production_cases:
        description: Ordered production route:strategy pairs, comma separated, or all
        default: all
      repeat_processes:
        description: "Independent process batches (1 or 2)"
        type: choice
        options: ["1", "2"]
        default: "1"
      case:
        description: "Temperature case"
        type: choice
        options: [both, t120_rho035, t130_rho080]
        default: both
      verify_only:
        description: "Only candidate and compatibility checks (local/T120)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: palc-matched-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production:
    if: inputs.profile == 'production'
    uses: ./.github/workflows/palc-production-comparison.yml
    with:
      profile: medium
      repetitions: ${{ inputs.repetitions }}
      budget_seconds: ${{ inputs.budget_seconds }}
      cases: ${{ inputs.production_cases }}
  pilot:
    if: inputs.profile != 'production'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(inputs.case == 't120_rho035' && '["t120_rho035"]' || inputs.case == 't130_rho080' && '["t130_rho080"]' || '["t120_rho035","t130_rho080"]') }}
    env:
      JULIA_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      JULIA_PKG_PRECOMPILE_AUTO: "0"
      PILOT_OUTPUT: temp_palc_matched/${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.5"
      - uses: julia-actions/cache@v2
        with:
          cache-name: palc-matched-pilot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instantiate root and isolated continuation environments
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          julia --project=scripts/analysis/pnjl_bifurcation_spike -e 'using Pkg; Pkg.instantiate()'
      - name: Precompile the shared dependency stack before timing
        run: julia --startup-file=no --project=scripts/analysis/pnjl_bifurcation_spike -e 'include("scripts/analysis/pnjl_bifurcation_spike/run_matched_pilot.jl")'
      - name: Verify counters and helpers
        if: matrix.case == 't120_rho035' && inputs.profile == 'local'
        run: |
          julia --project=. tests/unit/models/test_solver_work_telemetry.jl
          julia --project=. tests/unit/models/test_combined_equilibrium_helper.jl
          julia --project=. tests/unit/models/test_palc_matched_support.jl
          julia --project=. tests/unit/models/test_fixedasymrho_candidate_search.jl
          julia --project=. scripts/analysis/pnjl_bifurcation_spike/check_matched_telemetry.jl
          julia --project=scripts/analysis/pnjl_bifurcation_spike scripts/analysis/pnjl_bifurcation_spike/check_candidate_search.jl "$PILOT_OUTPUT/candidate_checks.json"
          python -m unittest discover -s tests/unit/python -p test_palc_matched_summary.py
      - name: Run bounded matched workloads
        if: ${{ !inputs.verify_only }}
        env:
          PILOT_PROFILE: ${{ inputs.profile }}
          PILOT_REPETITIONS: ${{ inputs.repetitions }}
          PILOT_BATCHES: ${{ inputs.repeat_processes }}
        run: |
          for batch in $(seq 1 "$PILOT_BATCHES"); do
            python scripts/analysis/pnjl_bifurcation_spike/run_matched_pilot.py --case '${{ matrix.case }}' --profile "$PILOT_PROFILE" --repetitions "$PILOT_REPETITIONS" --output "$PILOT_OUTPUT/batch_$batch"
          done
      - name: Compare target points and work
        if: always()
        run: |
          for batch in "$PILOT_OUTPUT"/batch_*; do
            [ -d "$batch" ] || continue
            python scripts/analysis/pnjl_bifurcation_spike/summarize_matched_pilot.py "$batch" --require-parity
            cat "$batch/summary.md" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: palc-matched-${{ matrix.case }}
          path: ${{ env.PILOT_OUTPUT }}
          retention-days: 14
          if-no-files-found: warn
