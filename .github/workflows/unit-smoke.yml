name: unit-smoke

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/unit/**"
      - "config/**"
      - "web/**"
      - "scripts/dev/check_model_profile_matrix.jl"
      - "Project.toml"
      - "Manifest.toml"
      - ".github/workflows/unit-smoke.yml"
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/unit/**"
      - "config/**"
      - "web/**"
      - "scripts/dev/check_model_profile_matrix.jl"
      - "Project.toml"
      - "Manifest.toml"
      - ".github/workflows/unit-smoke.yml"
  workflow_dispatch:

jobs:
  frontend-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run offline frontend contracts
        run: node --test web/js/runtime_config.contract.test.mjs web/js/api.scan.test.mjs web/js/api.timeout.test.mjs web/js/task_store.test.mjs

  unit-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.5"

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Check unit skip policy
        run: julia --project=. scripts/dev/check_unit_skip_policy.jl

      - name: Check model profile matrix
        run: julia --project=. scripts/dev/check_model_profile_matrix.jl

      - name: Run unit core profile
        env:
          UNIT_PROFILE: core
        run: julia --project=. tests/unit/runtests.jl
