name: unit-smoke

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/unit/**"
      - "config/**"
      - "scripts/dev/check_model_profile_matrix.jl"
      - "Project.toml"
      - "Manifest.toml"
      - ".github/workflows/unit-smoke.yml"
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/unit/**"
      - "config/**"
      - "scripts/dev/check_model_profile_matrix.jl"
      - "Project.toml"
      - "Manifest.toml"
      - ".github/workflows/unit-smoke.yml"
  workflow_dispatch:

jobs:
  unit-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2
        with:
          cache-name: julia-cache-unit-smoke

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Check unit skip policy
        run: julia --project=. scripts/dev/check_unit_skip_policy.jl

      - name: Check model profile matrix
        run: julia --project=. scripts/dev/check_model_profile_matrix.jl

      - name: Run unit smoke profile
        env:
          UNIT_PROFILE: smoke
        run: julia --project=. tests/unit/runtests.jl
