name: models-entry-contract

on:
  pull_request:
    paths:
      - "src/**"
      - "docs/architecture/models_solver_contract.md"
      - "scripts/dev/check_models_entry_contract.jl"
      - ".github/workflows/models-entry-contract.yml"
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "docs/architecture/models_solver_contract.md"
      - "scripts/dev/check_models_entry_contract.jl"
      - ".github/workflows/models-entry-contract.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.5"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2
        with:
          cache-name: julia-cache-models-entry-contract

      - name: Instantiate dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run models entry contract check
        run: julia --project=. scripts/dev/check_models_entry_contract.jl
