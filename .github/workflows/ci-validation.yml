name: ci-validation

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/regression/**"
      - "tests/validation/**"
      - "tests/baselines/**"
      - "Project.toml"
      - "Manifest.toml"
      - ".github/workflows/ci-validation.yml"
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/regression/**"
      - "tests/validation/**"
      - "tests/baselines/**"
      - "Project.toml"
      - "Manifest.toml"
      - ".github/workflows/ci-validation.yml"
  workflow_dispatch:

jobs:
  regression-validation-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.5"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2
        with:
          cache-name: julia-cache-validation

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Run regression core
        env:
          REGRESSION_PROFILE: core
        run: julia --project=. tests/regression/runtests.jl

      - name: Run validation core
        env:
          VALIDATION_PROFILE: core
        run: julia --project=. tests/validation/runtests.jl
