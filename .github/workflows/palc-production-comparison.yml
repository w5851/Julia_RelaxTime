name: palc-production-comparison
on:
  workflow_call:
    inputs:
      profile:
        type: string
        default: medium
      repetitions:
        type: string
        default: "2"
      budget_seconds:
        type: string
        default: "2700"
      cases:
        type: string
        default: all
      probe_anchors:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [quick, medium, constraints, endpoints, anchors, promotion]
        default: medium
      repetitions:
        type: choice
        options: ["1", "2", "3"]
        default: "2"
      budget_seconds:
        description: Shared numerical budget, at most 3000 seconds
        type: string
        default: "2700"
      cases:
        description: Route:strategy pairs for scans, path names for endpoints, or all
        type: string
        default: all
      probe_anchors:
        description: Inspect individual endpoint guesses outside matched timing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: palc-production-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      JULIA_NUM_PRECOMPILE_TASKS: "2"
      JULIA_PKG_PRECOMPILE_AUTO: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.5"
      - uses: julia-actions/cache@v2
        with:
          cache-name: palc-production
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare the production environment
        timeout-minutes: 10
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); include("src/models/Models.jl")'
      - name: Check path and branch behavior
        timeout-minutes: 3
        run: julia --project=. -e 'include("tests/unit/models/test_path_continuation.jl"); include("tests/unit/models/test_palc_production_contract.jl")'
      - name: Compare production scans within a shared budget
        if: inputs.profile != 'constraints' && inputs.profile != 'endpoints' && inputs.profile != 'anchors' && inputs.profile != 'promotion'
        env:
          PROFILE: ${{ inputs.profile }}
          REPETITIONS: ${{ inputs.repetitions }}
          BUDGET: ${{ inputs.budget_seconds }}
          CASES: ${{ inputs.cases }}
        run: python scripts/analysis/pnjl_bifurcation_spike/compare_production.py --output temp_palc_production --profile "$PROFILE" --repetitions "$REPETITIONS" --budget-seconds "$BUDGET" --cases "$CASES"
      - name: Compare additional constraint modes and single-anchor coverage
        if: inputs.profile == 'constraints'
        env:
          REPETITIONS: ${{ inputs.repetitions }}
          BUDGET: ${{ inputs.budget_seconds }}
          CASES: ${{ inputs.cases }}
        run: python scripts/analysis/pnjl_bifurcation_spike/compare_constraints.py --output temp_palc_production --repetitions "$REPETITIONS" --budget-seconds "$BUDGET" --cases "$CASES"
      - name: Compare two endpoint continuation and PALC
        if: inputs.profile == 'endpoints' || inputs.profile == 'anchors' || inputs.profile == 'promotion'
        env:
          REPETITIONS: ${{ inputs.repetitions }}
          BUDGET: ${{ inputs.budget_seconds }}
          PROFILE: ${{ inputs.profile }}
          CASES: ${{ inputs.cases }}
          PROBE: ${{ inputs.probe_anchors }}
        run: |
          extra=()
          if [ "$PROBE" = "true" ]; then extra+=(--probe-anchors); fi
          python scripts/analysis/pnjl_bifurcation_spike/compare_endpoints.py --output temp_palc_production --repetitions "$REPETITIONS" --budget-seconds "$BUDGET" --scope "$PROFILE" --cases "$CASES" "${extra[@]}"
      - name: Summarize completed results
        if: always()
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          if [ "$PROFILE" = "endpoints" ] || [ "$PROFILE" = "anchors" ] || [ "$PROFILE" = "promotion" ]; then
            python scripts/analysis/pnjl_bifurcation_spike/compare_endpoints.py --output temp_palc_production --summarize-only
          elif [ "$PROFILE" = "constraints" ]; then
            python scripts/analysis/pnjl_bifurcation_spike/compare_constraints.py --output temp_palc_production --summarize-only
          else
            python scripts/analysis/pnjl_bifurcation_spike/compare_production.py --output temp_palc_production --summarize-only
          fi
          cat temp_palc_production/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: palc-production-comparison
          path: temp_palc_production
          retention-days: 14
