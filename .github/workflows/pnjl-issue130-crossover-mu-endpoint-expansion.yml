name: PNJL Issue130 Crossover Mu Endpoint Expansion

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Full-xi numerical matrix or authenticated aggregate replay"
        required: false
        default: numerical
        type: choice
        options: [numerical, aggregate_replay]
      calculation_ref:
        description: "Immutable calculation SHA"
        required: true
        type: string
      tag:
        description: "Versioned diagnostic artifact tag"
        required: false
        default: issue130_crossover_mu_endpoint_expansion_v1
        type: string
      source_run_id:
        description: "Completed numerical source run for aggregate replay"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

env:
  TARGET_LIST: docs/analysis/pnjl/issue130_endpoint_refinement_preflight_v1/crossover_mu/tables/target_list.csv
  SCHEMA_VERSION: pnjl_issue130_crossover_mu_endpoint_expansion_v1

jobs:
  prepare:
    if: ${{ inputs.mode == 'numerical' }}
    name: prepare full crossover target matrix
    runs-on: ubuntu-latest
    outputs:
      target_ids: ${{ steps.targets.outputs.target_ids }}
      target_count: ${{ steps.targets.outputs.target_count }}
    steps:
      - name: Checkout workflow and postprocess head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Freeze eligible full-xi target IDs
        id: targets
        shell: bash
        env:
          TARGET_LIST: ${{ env.TARGET_LIST }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import csv
          import json
          from pathlib import Path

          path = Path("${{ env.TARGET_LIST }}")
          rows = list(csv.DictReader(path.open(encoding="utf-8", newline="")))
          eligible = [
              row["target_id"]
              for row in rows
              if row.get("target_kind") == "crossover_mu_endpoint"
              and row.get("physical_side") == "crossover_mu_lt_CEP_proxy"
          ]
          if len(eligible) != len(set(eligible)) or len(eligible) != 186:
              raise SystemExit(f"expected 186 unique eligible targets, found {len(eligible)}")
          print("target_ids=" + json.dumps(eligible, separators=(",", ":")))
          print(f"target_count={len(eligible)}")
          PY

  numerical:
    if: ${{ inputs.mode == 'numerical' }}
    needs: [prepare]
    name: "crossover endpoint ${{ matrix.target_id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        target_id: ${{ fromJSON(needs.prepare.outputs.target_ids) }}
    env:
      CALCULATION_SHA: ${{ inputs.calculation_ref }}
      WORKFLOW_HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Validate immutable calculation ref
        shell: bash
        run: |
          [[ "$CALCULATION_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "calculation_ref must be a 40-character immutable SHA" >&2
            exit 1
          }

      - name: Checkout workflow and postprocess head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify workflow checkout SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$WORKFLOW_HEAD_SHA"

      - name: Materialize calculation worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CALCULATION_SHA" --depth=1
          git worktree add --detach calculation "$CALCULATION_SHA"
          test "$(git -C calculation rev-parse HEAD)" = "$CALCULATION_SHA"
          mkdir -p calculation/scripts/analysis calculation/endpoint_inputs
          cp scripts/analysis/pnjl_issue130_crossover_mu_endpoint_pilot.jl calculation/scripts/analysis/
          cp "$TARGET_LIST" calculation/endpoint_inputs/target_list.csv

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.5"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2
        with:
          cache-name: julia-cache-issue130-crossover-endpoint-expansion-v1

      - name: Install calculation dependencies
        run: julia --project=calculation -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Run one full-xi crossover endpoint target
        shell: bash
        env:
          TARGET_ID: ${{ matrix.target_id }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "artifacts/${TARGET_ID}"
          julia --project=calculation calculation/scripts/analysis/pnjl_issue130_crossover_mu_endpoint_pilot.jl \
            --calculation-sha "$CALCULATION_SHA" \
            --workflow-head-sha "$WORKFLOW_HEAD_SHA" \
            --target-id "$TARGET_ID" \
            --target-list calculation/endpoint_inputs/target_list.csv \
            --tag "$TAG" \
            --schema-version "$SCHEMA_VERSION" \
            --target-selection full \
            --output-dir "artifacts/${TARGET_ID}"

      - name: Upload numerical target artifact
        uses: actions/upload-artifact@v4
        with:
          name: issue130-crossover-mu-endpoint-expansion-${{ matrix.target_id }}-${{ inputs.tag }}
          path: artifacts/${{ matrix.target_id }}
          if-no-files-found: error
          retention-days: 90

  aggregate:
    if: ${{ always() && inputs.mode == 'numerical' && needs.prepare.result == 'success' }}
    name: aggregate full crossover endpoint expansion
    needs: [prepare, numerical]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow and postprocess head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download numerical target artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: issue130-crossover-mu-endpoint-expansion-*-${{ inputs.tag }}
          path: target-artifacts
          merge-multiple: false

      - name: Validate and aggregate full crossover evidence
        shell: bash
        env:
          CALCULATION_SHA: ${{ inputs.calculation_ref }}
          POSTPROCESS_SHA: ${{ github.sha }}
          SOURCE_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set +e
          python scripts/analysis/collect_pnjl_issue130_crossover_mu_endpoint_pilot.py \
            --input-dir target-artifacts \
            --output-dir aggregate \
            --target-list "$TARGET_LIST" \
            --calculation-sha "$CALCULATION_SHA" \
            --postprocess-sha "$POSTPROCESS_SHA" \
            --source-workflow-sha "$SOURCE_WORKFLOW_SHA" \
            --schema-version "$SCHEMA_VERSION" \
            --selection full \
            --run-mode numerical
          status=$?
          cat aggregate/verdict.json >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi

      - name: Upload full expansion aggregate
        uses: actions/upload-artifact@v4
        with:
          name: issue130-crossover-mu-endpoint-expansion-${{ inputs.tag }}-aggregate
          path: aggregate
          if-no-files-found: error
          retention-days: 90

  aggregate_replay:
    if: ${{ inputs.mode == 'aggregate_replay' }}
    name: replay full crossover endpoint expansion
    runs-on: ubuntu-latest
    steps:
      - name: Validate replay inputs
        shell: bash
        env:
          CALCULATION_SHA: ${{ inputs.calculation_ref }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          [[ "$CALCULATION_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1

      - name: Checkout workflow and postprocess head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify source run and download numerical artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          source_json="$(gh run view "$SOURCE_RUN_ID" --json status,conclusion,headSha)"
          test "$(echo "$source_json" | jq -r .status)" = completed
          test "$(echo "$source_json" | jq -r .conclusion)" = success
          source_workflow_sha="$(echo "$source_json" | jq -r .headSha)"
          [[ "$source_workflow_sha" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
          echo "SOURCE_WORKFLOW_SHA=$source_workflow_sha" >> "$GITHUB_ENV"
          mkdir -p target-artifacts
          gh run download "$SOURCE_RUN_ID" \
            --pattern 'issue130-crossover-mu-endpoint-expansion-*' \
            --dir target-artifacts

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Replay and validate full crossover evidence
        shell: bash
        env:
          CALCULATION_SHA: ${{ inputs.calculation_ref }}
          POSTPROCESS_SHA: ${{ github.sha }}
        run: |
          set +e
          python scripts/analysis/collect_pnjl_issue130_crossover_mu_endpoint_pilot.py \
            --input-dir target-artifacts \
            --output-dir aggregate \
            --target-list "$TARGET_LIST" \
            --calculation-sha "$CALCULATION_SHA" \
            --postprocess-sha "$POSTPROCESS_SHA" \
            --source-workflow-sha "$SOURCE_WORKFLOW_SHA" \
            --schema-version "$SCHEMA_VERSION" \
            --selection full \
            --run-mode aggregate_replay \
            --source-run-id "${{ inputs.source_run_id }}"
          status=$?
          cat aggregate/verdict.json >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi

      - name: Upload replay aggregate
        uses: actions/upload-artifact@v4
        with:
          name: issue130-crossover-mu-endpoint-expansion-${{ inputs.tag }}-aggregate-replay
          path: aggregate
          if-no-files-found: error
          retention-days: 90
