name: nightly-full-suite

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.5"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2
        with:
          cache-name: julia-cache-nightly-full

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Run unit full profile
        env:
          UNIT_PROFILE: full
          UNIT_VERBOSE_INCLUDE: "1"
        run: julia --project=. tests/unit/runtests.jl

      - name: Run regression full profile
        env:
          REGRESSION_PROFILE: full
          REGRESSION_MAGNETIC_SCOPE: nightly
        run: julia --project=. tests/regression/runtests.jl

      - name: Run integration full profile (models + pnjl shard)
        id: integration_models_pnjl
        timeout-minutes: 60
        run: |
          files=$(git ls-files "tests/integration/models/test_*.jl" "tests/integration/pnjl/test_*.jl" | sed 's#^tests/integration/##' | paste -sd ';' -)
          if [ -z "$files" ]; then
            echo "No integration files found for models+pnjl shard" >&2
            exit 1
          fi
          echo "INTEGRATION_FILES=$files"
          INTEGRATION_FILES="$files" julia --project=. tests/integration/runtests.jl

      - name: Run integration full profile (config shard)
        id: integration_config
        timeout-minutes: 20
        run: |
          files=$(git ls-files "tests/integration/config/test_*.jl" | sed 's#^tests/integration/##' | paste -sd ';' -)
          if [ -z "$files" ]; then
            echo "No integration files found for config shard" >&2
            exit 1
          fi
          echo "INTEGRATION_FILES=$files"
          INTEGRATION_FILES="$files" julia --project=. tests/integration/runtests.jl

      - name: Run integration full profile (relaxtime shard except ensure-A)
        id: integration_relaxtime
        continue-on-error: true
        timeout-minutes: 75
        run: |
          files=$(git ls-files "tests/integration/relaxtime/test_*.jl" | sed 's#^tests/integration/##' | grep -v '^relaxtime/test_utils\.jl$' | grep -v '^relaxtime/test_ensure_quark_params_has_A_property\.jl$' | paste -sd ';' -)
          if [ -z "$files" ]; then
            echo "No integration files found for relaxtime shard" >&2
            exit 1
          fi
          echo "INTEGRATION_FILES=$files"
          INTEGRATION_FILES="$files" julia --project=. tests/integration/runtests.jl

      - name: Run integration full profile (relaxtime ensure-A watchdog)
        id: integration_relaxtime_ensure_a
        if: always()
        timeout-minutes: 15
        run: |
          file="relaxtime/test_ensure_quark_params_has_A_property.jl"
          echo "INTEGRATION_FILES=$file"
          INTEGRATION_FILES="$file" julia --project=. tests/integration/runtests.jl

      - name: Run validation full profile
        id: validation_full
        if: always()
        timeout-minutes: 45
        env:
          VALIDATION_PROFILE: full
        run: julia --project=. tests/validation/runtests.jl

      - name: Final test gate
        if: always()
        run: |
          failures=0

          check_step() {
            local step_name="$1"
            local outcome="$2"
            if [ "$outcome" != "success" ]; then
              echo "::error::Step failed: $step_name (outcome=$outcome)"
              failures=$((failures + 1))
            fi
          }

          check_step "integration models+pnjl" "${{ steps.integration_models_pnjl.outcome }}"
          check_step "integration config" "${{ steps.integration_config.outcome }}"
          check_step "integration relaxtime except ensure-A" "${{ steps.integration_relaxtime.outcome }}"
          check_step "integration relaxtime ensure-A" "${{ steps.integration_relaxtime_ensure_a.outcome }}"
          check_step "validation full" "${{ steps.validation_full.outcome }}"

          if [ "$failures" -ne 0 ]; then
            echo "Final gate detected $failures failing step(s)."
            exit 1
          fi

          echo "Final gate passed: all required steps succeeded."
