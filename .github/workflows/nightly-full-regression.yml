name: nightly-full-regression

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  full-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2
        with:
          cache-name: julia-cache-nightly-full

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Run unit full profile
        env:
          UNIT_PROFILE: full
          UNIT_VERBOSE_INCLUDE: "1"
        run: julia --project=. tests/unit/runtests.jl

      - name: Run transport fixedpoint regression gate
        run: julia --project=. scripts/relaxtime/run_transport_fixedpoint_regression.jl

      - name: Run total-cross-section fixedpoint regression gate
        run: julia --project=. scripts/relaxtime/run_total_cross_section_fixedpoint_regression.jl

      - name: Run PNJL magnetic fixedpoint regression gate
        run: julia --project=. scripts/pnjl/run_magnetic_fixedpoint_regression.jl
