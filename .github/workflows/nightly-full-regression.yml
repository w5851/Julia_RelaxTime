name: nightly-full-suite

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  full-suite:
    name: full (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: unit
            timeout: 90
          - shard: regression
            timeout: 90
          - shard: integration-models-pnjl
            timeout: 65
          - shard: integration-config
            timeout: 25
          - shard: integration-relaxtime
            timeout: 80
          - shard: integration-ensure-a
            timeout: 20
          - shard: validation
            timeout: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.5"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2
        with:
          cache-name: julia-cache-nightly-full

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Run full profile shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          case "$SHARD" in
            unit)
              UNIT_PROFILE=full UNIT_VERBOSE_INCLUDE=1 julia --project=. tests/unit/runtests.jl
              ;;
            regression)
              REGRESSION_PROFILE=full REGRESSION_MAGNETIC_SCOPE=nightly julia --project=. tests/regression/runtests.jl
              ;;
            validation)
              VALIDATION_PROFILE=full julia --project=. tests/validation/runtests.jl
              ;;
            integration-*)
              case "$SHARD" in
                integration-models-pnjl)
                  files=$(git ls-files "tests/integration/models/test_*.jl" "tests/integration/pnjl/test_*.jl" | sed 's#^tests/integration/##' | paste -sd ';' -)
                  ;;
                integration-config)
                  files=$(git ls-files "tests/integration/config/test_*.jl" | sed 's#^tests/integration/##' | paste -sd ';' -)
                  ;;
                integration-relaxtime)
                  files=$(git ls-files "tests/integration/relaxtime/test_*.jl" | sed 's#^tests/integration/##' | grep -v '^relaxtime/test_utils[.]jl$' | grep -v '^relaxtime/test_ensure_quark_params_has_A_property[.]jl$' | paste -sd ';' -)
                  ;;
                integration-ensure-a)
                  files="relaxtime/test_ensure_quark_params_has_A_property.jl"
                  ;;
                *) echo "Unknown integration shard: $SHARD" >&2; exit 1 ;;
              esac
              if [ -z "$files" ]; then
                echo "No integration files found for $SHARD" >&2
                exit 1
              fi
              echo "INTEGRATION_FILES=$files"
              INTEGRATION_FILES="$files" julia --project=. tests/integration/runtests.jl
              ;;
            *) echo "Unknown shard: $SHARD" >&2; exit 1 ;;
          esac

  final-gate:
    name: Final test gate
    needs: full-suite
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every full-suite shard
        env:
          SUITE_RESULT: ${{ needs.full-suite.result }}
        run: |
          if [ "$SUITE_RESULT" != "success" ]; then
            echo "::error::Full-suite shards did not all succeed (result=$SUITE_RESULT)."
            exit 1
          fi
          echo "Final gate passed: all full-suite shards succeeded."
