name: PNJL Dense Reference

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "artifact 标签后缀"
        required: false
        default: "dense"
        type: string
      xi_values:
        description: "显式 ξ 锚点（逗号分隔；为空时使用区间参数）"
        required: false
        default: ""
        type: string
      xi_min:
        description: "ξ 最小值（仅在 xi_values 为空时使用）"
        required: false
        default: "-0.5"
        type: string
      xi_max:
        description: "ξ 最大值（仅在 xi_values 为空时使用）"
        required: false
        default: "0.5"
        type: string
      xi_step:
        description: "ξ 锚点步长（仅在 xi_values 为空时使用）"
        required: false
        default: "0.05"
        type: string
      adaptive_xi:
        description: "在每个 ξ 区间按相线中点插值误差递归补点（full reference only）"
        required: false
        default: false
        type: boolean
      T_min:
        description: "最低温度 T_min (MeV)"
        required: false
        default: "60"
        type: string
      T_max:
        description: "最高温度 T_max (MeV)"
        required: false
        default: "240"
        type: string
      T_step:
        description: "初始温度锚点步长 ΔT (MeV)"
        required: false
        default: "5"
        type: string
      adaptive_T:
        description: "按一阶相线中点插值误差递归补温度点"
        required: false
        default: true
        type: boolean
      rho_min:
        description: "最低密度 ρ_min (ρ/ρ₀)"
        required: false
        default: "0.0"
        type: string
      rho_max:
        description: "最高密度 ρ_max (ρ/ρ₀)"
        required: false
        default: "4.0"
        type: string
      rho_step:
        description: "初始密度步长 Δρ (ρ/ρ₀)"
        required: false
        default: "0.05"
        type: string
      rho_geometry_convergence:
        description: "要求粗细 rho 网格的 Maxwell/spinodal 几何量收敛"
        required: false
        default: true
        type: boolean
      p_num:
        description: "gap/thermo 动量积分节点"
        required: false
        default: "24"
        type: string
      t_num:
        description: "gap/thermo 角度积分节点"
        required: false
        default: "8"
        type: string
      thermo_quadrature_policy:
        description: "phase 热积分策略"
        required: false
        default: "tensor_gauss"
        type: choice
        options:
          - tensor_gauss
          - rs_reduced_adaptive
      iterations:
        description: "求解迭代上限"
        required: false
        default: "80"
        type: string
      crossover_only:
        description: "仅生成 crossover reference"
        required: false
        default: true
        type: boolean
      crossover_mu0_only:
        description: "仅生成 mu_q = 0 的 crossover 点"
        required: false
        default: false
        type: boolean
      crossover_n_mu:
        description: "crossover mu_q 采样点数"
        required: false
        default: "16"
        type: string
      crossover_mu_max:
        description: "crossover mu_q 最大值 (MeV)"
        required: false
        default: "450"
        type: string
      overwrite:
        description: "覆盖同一次作业暂存区中的同名输出"
        required: false
        default: true
        type: boolean
      advanced_config_json:
        description: "高级误差参数 JSON；键由 scripts/pnjl/resolve_dense_reference_action_config.py 白名单约束"
        required: false
        default: "{}"
        type: string
      calculation_ref:
        description: "用于数值 shard checkout 的不可变 40 字符计算 SHA；留空使用 workflow head"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      initial_matrix: ${{ steps.publish.outputs.initial_matrix }}
      expected_xi_csv: ${{ steps.publish.outputs.expected_xi_csv }}
      initial_intervals: ${{ steps.publish.outputs.initial_intervals }}
      initial_shard_count: ${{ steps.publish.outputs.initial_shard_count }}
      xi_refine_levels: ${{ steps.publish.outputs.xi_refine_levels }}
      xi_position_tol: ${{ steps.publish.outputs.xi_position_tol }}
      xi_density_tol: ${{ steps.publish.outputs.xi_density_tol }}
      xi_maxwell_area_tol: ${{ steps.publish.outputs.xi_maxwell_area_tol }}
      xi_response_rtol: ${{ steps.publish.outputs.xi_response_rtol }}
      common_args_json: ${{ steps.publish.outputs.common_args_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve staged one-xi plan
        shell: bash
        env:
          ACTION_INPUTS_JSON: ${{ toJSON(inputs) }}
        run: |
          python scripts/pnjl/plan_dense_reference_action.py \
            --inputs-json "${ACTION_INPUTS_JSON}" \
            --output "${RUNNER_TEMP}/dense_reference_plan.json"

      - name: Publish staged plan
        id: publish
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads(
              Path(os.environ["RUNNER_TEMP"]).joinpath("dense_reference_plan.json").read_text(encoding="utf-8")
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for key in (
                  "initial_matrix",
                  "initial_intervals",
                  "common_args",
              ):
                  output_key = "common_args_json" if key == "common_args" else key
                  handle.write(f"{output_key}={json.dumps(plan[key], separators=(',', ':'))}\n")
              for key in (
                  "expected_xi_csv",
                  "initial_shard_count",
                  "xi_refine_levels",
                  "xi_position_tol",
                  "xi_density_tol",
                  "xi_maxwell_area_tol",
                  "xi_response_rtol",
              ):
                  handle.write(f"{key}={plan[key]}\n")
          PY

  generate_initial_shards:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.initial_matrix) }}
    uses: ./.github/workflows/pnjl-dense-reference-shard.yml
    with:
      tag: ${{ inputs.tag || 'dense' }}
      stage: ${{ matrix.stage }}
      shard_id: ${{ matrix.shard_id }}
      xi: ${{ matrix.xi }}
      enabled: true
      common_args_json: ${{ needs.plan.outputs.common_args_json }}
      crossover_only: ${{ inputs.crossover_only }}
      crossover_mu0_only: ${{ inputs.crossover_mu0_only }}
      calculation_ref: ${{ inputs.calculation_ref }}

  assess_xi_level1:
    needs: [plan, generate_initial_shards]
    if: ${{ fromJSON(needs.plan.outputs.xi_refine_levels) >= 1 }}
    uses: ./.github/workflows/pnjl-dense-reference-assess-xi.yml
    with:
      tag: ${{ inputs.tag || 'dense' }}
      level: 1
      max_refine_level: ${{ fromJSON(needs.plan.outputs.xi_refine_levels) }}
      intervals_json: ${{ needs.plan.outputs.initial_intervals }}
      expected_xi_csv: ${{ needs.plan.outputs.expected_xi_csv }}
      position_tol: ${{ needs.plan.outputs.xi_position_tol }}
      density_tol: ${{ needs.plan.outputs.xi_density_tol }}
      maxwell_area_tol: ${{ needs.plan.outputs.xi_maxwell_area_tol }}
      response_rtol: ${{ needs.plan.outputs.xi_response_rtol }}
      source_calculation_sha: ${{ inputs.calculation_ref || github.sha }}

  generate_xi_level2:
    needs: [plan, assess_xi_level1]
    if: ${{ fromJSON(needs.plan.outputs.xi_refine_levels) >= 2 }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.assess_xi_level1.outputs.matrix) }}
    uses: ./.github/workflows/pnjl-dense-reference-shard.yml
    with:
      tag: ${{ inputs.tag || 'dense' }}
      stage: ${{ matrix.stage }}
      shard_id: ${{ matrix.shard_id }}
      xi: ${{ matrix.xi }}
      enabled: ${{ matrix.enabled }}
      common_args_json: ${{ needs.plan.outputs.common_args_json }}
      crossover_only: ${{ inputs.crossover_only }}
      crossover_mu0_only: ${{ inputs.crossover_mu0_only }}
      calculation_ref: ${{ inputs.calculation_ref }}

  assess_xi_level2:
    needs: [plan, generate_initial_shards, assess_xi_level1, generate_xi_level2]
    if: ${{ fromJSON(needs.plan.outputs.xi_refine_levels) >= 2 }}
    uses: ./.github/workflows/pnjl-dense-reference-assess-xi.yml
    with:
      tag: ${{ inputs.tag || 'dense' }}
      level: 2
      max_refine_level: ${{ fromJSON(needs.plan.outputs.xi_refine_levels) }}
      intervals_json: ${{ needs.assess_xi_level1.outputs.intervals }}
      expected_xi_csv: ${{ needs.plan.outputs.expected_xi_csv }}
      position_tol: ${{ needs.plan.outputs.xi_position_tol }}
      density_tol: ${{ needs.plan.outputs.xi_density_tol }}
      maxwell_area_tol: ${{ needs.plan.outputs.xi_maxwell_area_tol }}
      response_rtol: ${{ needs.plan.outputs.xi_response_rtol }}
      source_calculation_sha: ${{ inputs.calculation_ref || github.sha }}

  generate_xi_level3:
    needs: [plan, assess_xi_level2]
    if: ${{ fromJSON(needs.plan.outputs.xi_refine_levels) >= 3 }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.assess_xi_level2.outputs.matrix) }}
    uses: ./.github/workflows/pnjl-dense-reference-shard.yml
    with:
      tag: ${{ inputs.tag || 'dense' }}
      stage: ${{ matrix.stage }}
      shard_id: ${{ matrix.shard_id }}
      xi: ${{ matrix.xi }}
      enabled: ${{ matrix.enabled }}
      common_args_json: ${{ needs.plan.outputs.common_args_json }}
      crossover_only: ${{ inputs.crossover_only }}
      crossover_mu0_only: ${{ inputs.crossover_mu0_only }}
      calculation_ref: ${{ inputs.calculation_ref }}

  assess_xi_level3:
    needs: [plan, generate_initial_shards, assess_xi_level2, generate_xi_level3]
    if: ${{ fromJSON(needs.plan.outputs.xi_refine_levels) >= 3 }}
    uses: ./.github/workflows/pnjl-dense-reference-assess-xi.yml
    with:
      tag: ${{ inputs.tag || 'dense' }}
      level: 3
      max_refine_level: ${{ fromJSON(needs.plan.outputs.xi_refine_levels) }}
      intervals_json: ${{ needs.assess_xi_level2.outputs.intervals }}
      expected_xi_csv: ${{ needs.plan.outputs.expected_xi_csv }}
      position_tol: ${{ needs.plan.outputs.xi_position_tol }}
      density_tol: ${{ needs.plan.outputs.xi_density_tol }}
      maxwell_area_tol: ${{ needs.plan.outputs.xi_maxwell_area_tol }}
      response_rtol: ${{ needs.plan.outputs.xi_response_rtol }}
      source_calculation_sha: ${{ inputs.calculation_ref || github.sha }}

  merge:
    needs:
      - plan
      - generate_initial_shards
      - assess_xi_level1
      - generate_xi_level2
      - assess_xi_level2
      - generate_xi_level3
      - assess_xi_level3
    if: >-
      ${{
        always() &&
        needs.generate_initial_shards.result == 'success' &&
        (fromJSON(needs.plan.outputs.xi_refine_levels) < 1 || needs.assess_xi_level1.result == 'success') &&
        (fromJSON(needs.plan.outputs.xi_refine_levels) < 2 ||
          (needs.generate_xi_level2.result == 'success' && needs.assess_xi_level2.result == 'success')) &&
        (fromJSON(needs.plan.outputs.xi_refine_levels) < 3 ||
          (needs.generate_xi_level3.result == 'success' && needs.assess_xi_level3.result == 'success'))
      }}
    runs-on: ubuntu-latest
    env:
      ARTIFACT_RETENTION_DAYS: "30"
      SHARDS_ROOT: data/outputs/artifacts/pnjl_dense_reference/${{ github.run_id }}/downloaded_shards
      XI_PLAN_ROOT: data/outputs/artifacts/pnjl_dense_reference/${{ github.run_id }}/downloaded_xi_plans
      REFERENCE_ROOT: data/outputs/artifacts/pnjl_dense_reference/${{ github.run_id }}/reference
      REPORT_PATH: data/outputs/artifacts/pnjl_dense_reference/${{ github.run_id }}/validation_report.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download all successful xi shards
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          pattern: pnjl-dense-reference-shard-${{ inputs.tag || 'dense' }}-*
          path: ${{ env.SHARDS_ROOT }}

      - name: Download staged xi convergence records
        if: ${{ fromJSON(needs.plan.outputs.xi_refine_levels) >= 1 }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          pattern: pnjl-dense-reference-xi-plan-${{ inputs.tag || 'dense' }}-level*
          path: ${{ env.XI_PLAN_ROOT }}

      - name: Deterministically merge xi shards
        shell: bash
        run: |
          rm -rf "${REFERENCE_ROOT}"
          mkdir -p "${REFERENCE_ROOT}"
          merge_cmd=(
            python scripts/pnjl/merge_dense_phase_reference_shards.py
            --shards-root "${SHARDS_ROOT}"
            --reference-root "${REFERENCE_ROOT}"
            --tag "${{ inputs.tag || 'dense' }}"
            "--expected-xi-list=${{ needs.plan.outputs.expected_xi_csv }}"
            --expected-calculation-git-commit "${{ inputs.calculation_ref || github.sha }}"
            --postprocess-git-commit "${GITHUB_SHA}"
            --source-workflow-run-id "${GITHUB_RUN_ID}"
            --overwrite
          )
          if [ "${{ needs.plan.outputs.xi_refine_levels }}" -ge 1 ]; then
            merge_cmd+=(--xi-convergence-root "${XI_PLAN_ROOT}")
          fi
          "${merge_cmd[@]}"

      - name: Validate merged dense reference artifact
        shell: bash
        run: |
          validate_cmd=(
            python scripts/pnjl/validate_dense_reference_artifact.py
            --reference-root "${REFERENCE_ROOT}"
            --tag "${{ inputs.tag || 'dense' }}"
            --min-crossover-rows 1
            --report-path "${REPORT_PATH}"
          )
          if [ "${{ inputs.crossover_only }}" = "true" ]; then
            validate_cmd+=(--expect-crossover-only)
          else
            validate_cmd+=(--expect-full-reference)
          fi
          if [ "${{ inputs.crossover_mu0_only }}" = "true" ]; then
            validate_cmd+=(--expect-mu0-only)
          fi
          "${validate_cmd[@]}"

      - name: Upload merged dense reference artifact
        uses: actions/upload-artifact@v4
        with:
          name: pnjl-dense-reference-${{ inputs.tag || 'dense' }}
          path: |
            ${{ env.REFERENCE_ROOT }}/*_${{ inputs.tag || 'dense' }}.csv
            ${{ env.REFERENCE_ROOT }}/*_${{ inputs.tag || 'dense' }}.meta.json
            ${{ env.REFERENCE_ROOT }}/phase_reference_${{ inputs.tag || 'dense' }}_manifest.json
            ${{ env.REPORT_PATH }}
          retention-days: ${{ fromJson(env.ARTIFACT_RETENTION_DAYS) }}
          if-no-files-found: error

      - name: Create step summary
        shell: bash
        env:
          INITIAL_SHARD_COUNT: ${{ needs.plan.outputs.initial_shard_count }}
          XI_REFINE_LEVELS: ${{ needs.plan.outputs.xi_refine_levels }}
          ADVANCED_CONFIG_JSON: ${{ inputs.advanced_config_json || '{}' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["REPORT_PATH"]).read_text(encoding="utf-8"))
          manifest_path = Path(os.environ["REFERENCE_ROOT"]) / "phase_reference_${{ inputs.tag || 'dense' }}_manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          config = manifest["config"]
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary_path.open("a", encoding="utf-8") as fh:
              fh.write("## PNJL Dense Reference Summary\n\n")
              fh.write(f"- artifact: `pnjl-dense-reference-${{ inputs.tag || 'dense' }}`\n")
              fh.write(f"- git commit: `{report['git_commit']}`\n")
              fh.write(f"- initial one-xi shards: `{os.environ['INITIAL_SHARD_COUNT']}`\n")
              fh.write(f"- staged xi refinement levels: `{os.environ['XI_REFINE_LEVELS']}`\n")
              fh.write(f"- resolved xi values: `{report['xi_values']}`\n")
              fh.write(f"- crossover rows / converged: `{report['crossover_rows']}` / `{report['converged_rows']}`\n")
              fh.write(f"- grid convergence rows / unconverged: `{report['grid_convergence_rows']}` / `{report['grid_unconverged_rows']}`\n")
              fh.write(f"- T range: `${{ inputs.T_min || '60' }} - ${{ inputs.T_max || '240' }}` MeV\n")
              fh.write(f"- explicit crossover T ceiling: `{config['crossover_T_max_MeV']}`\n")
              fh.write(f"- thermo quadrature: `{config['thermo_quadrature_policy']}` (rtol `{config['thermo_quadrature_rtol']}`, atol `{config['thermo_quadrature_atol']}`)\n")
              fh.write(f"- p_num/t_num: `{config['p_num']}` / `{config['t_num']}`\n")
              fh.write(f"- advanced_config_json: `{os.environ['ADVANCED_CONFIG_JSON']}`\n")
          PY
