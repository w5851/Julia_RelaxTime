name: PNJL Dense Reference

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "artifact 标签后缀"
        required: false
        default: "dense"
        type: string
      xi_values:
        description: "显式 ξ 锚点（逗号分隔；为空时使用区间参数）"
        required: false
        default: ""
        type: string
      xi_min:
        description: "ξ 最小值（仅在 xi_values 为空时使用）"
        required: false
        default: "-0.5"
        type: string
      xi_max:
        description: "ξ 最大值（仅在 xi_values 为空时使用）"
        required: false
        default: "0.5"
        type: string
      xi_step:
        description: "ξ 锚点步长（仅在 xi_values 为空时使用）"
        required: false
        default: "0.05"
        type: string
      adaptive_xi:
        description: "在每个 ξ 区间按相线中点插值误差递归补点（full reference only）"
        required: false
        default: false
        type: boolean
      T_min:
        description: "最低温度 T_min (MeV)"
        required: false
        default: "60"
        type: string
      T_max:
        description: "最高温度 T_max (MeV)"
        required: false
        default: "240"
        type: string
      T_step:
        description: "初始温度锚点步长 ΔT (MeV)"
        required: false
        default: "5"
        type: string
      adaptive_T:
        description: "按一阶相线中点插值误差递归补温度点"
        required: false
        default: true
        type: boolean
      rho_min:
        description: "最低密度 ρ_min (ρ/ρ₀)"
        required: false
        default: "0.0"
        type: string
      rho_max:
        description: "最高密度 ρ_max (ρ/ρ₀)"
        required: false
        default: "4.0"
        type: string
      rho_step:
        description: "初始密度步长 Δρ (ρ/ρ₀)"
        required: false
        default: "0.05"
        type: string
      rho_geometry_convergence:
        description: "要求粗细 rho 网格的 Maxwell/spinodal 几何量收敛"
        required: false
        default: true
        type: boolean
      p_num:
        description: "gap/thermo 动量积分节点"
        required: false
        default: "24"
        type: string
      t_num:
        description: "gap/thermo 角度积分节点"
        required: false
        default: "8"
        type: string
      thermo_quadrature_policy:
        description: "phase 热积分策略"
        required: false
        default: "tensor_gauss"
        type: choice
        options:
          - tensor_gauss
          - rs_reduced_adaptive
      iterations:
        description: "求解迭代上限"
        required: false
        default: "80"
        type: string
      crossover_only:
        description: "仅生成 crossover reference"
        required: false
        default: true
        type: boolean
      crossover_mu0_only:
        description: "仅生成 mu_q = 0 的 crossover 点"
        required: false
        default: false
        type: boolean
      crossover_n_mu:
        description: "crossover mu_q 采样点数"
        required: false
        default: "16"
        type: string
      crossover_mu_max:
        description: "crossover mu_q 最大值 (MeV)"
        required: false
        default: "450"
        type: string
      overwrite:
        description: "覆盖同一次作业暂存区中的同名输出"
        required: false
        default: true
        type: boolean
      advanced_config_json:
        description: "高级误差参数 JSON；键由 scripts/pnjl/resolve_dense_reference_action_config.py 白名单约束"
        required: false
        default: "{}"
        type: string

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      expected_xi_csv: ${{ steps.plan.outputs.expected_xi_csv }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
    steps:
      - name: Resolve deterministic xi interval shards
        id: plan
        shell: bash
        env:
          XI_VALUES: ${{ inputs.xi_values }}
          XI_MIN: ${{ inputs.xi_min || '-0.5' }}
          XI_MAX: ${{ inputs.xi_max || '0.5' }}
          XI_STEP: ${{ inputs.xi_step || '0.05' }}
          ADAPTIVE_XI: ${{ inputs.adaptive_xi }}
          CROSSOVER_ONLY: ${{ inputs.crossover_only }}
        run: |
          python - <<'PY'
          import json
          import os
          from decimal import Decimal

          raw = os.environ.get("XI_VALUES", "").strip()
          if raw:
              values = sorted({Decimal(token.strip()) for token in raw.split(",") if token.strip()})
          else:
              start = Decimal(os.environ["XI_MIN"])
              stop = Decimal(os.environ["XI_MAX"])
              step = Decimal(os.environ["XI_STEP"])
              if step <= 0 or stop < start:
                  raise SystemExit("invalid xi range")
              values = []
              current = start
              while current <= stop:
                  values.append(current)
                  current += step
              if values[-1] != stop:
                  values.append(stop)
          if not values:
              raise SystemExit("empty xi plan")
          if os.environ.get("ADAPTIVE_XI", "false").lower() == "true" and os.environ.get("CROSSOVER_ONLY", "false").lower() == "true":
              raise SystemExit("adaptive_xi requires crossover_only=false")

          def text(value):
              rendered = format(value, "f")
              return rendered.rstrip("0").rstrip(".") if "." in rendered else rendered

          include = []
          if len(values) == 1:
              include.append({"shard_id": "s000", "xi_list": text(values[0])})
          else:
              for index, (left, right) in enumerate(zip(values, values[1:])):
                  include.append({
                      "shard_id": f"s{index:03d}",
                      "xi_list": f"{text(left)},{text(right)}",
                  })
          matrix = json.dumps({"include": include}, separators=(",", ":"))
          expected = ",".join(text(value) for value in values)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"matrix={matrix}\n")
              handle.write(f"expected_xi_csv={expected}\n")
              handle.write(f"shard_count={len(include)}\n")
          PY

  generate-shards:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      ARTIFACT_RETENTION_DAYS: "30"
      STAGING_ROOT: data/outputs/artifacts/pnjl_dense_reference/${{ github.run_id }}/shards/${{ matrix.shard_id }}
      REFERENCE_ROOT: data/outputs/artifacts/pnjl_dense_reference/${{ github.run_id }}/shards/${{ matrix.shard_id }}/reference
      PROCESS_ROOT: data/processed/pnjl/ci_dense_reference/${{ github.run_id }}/${{ matrix.shard_id }}
      REPORT_PATH: data/outputs/artifacts/pnjl_dense_reference/${{ github.run_id }}/shards/${{ matrix.shard_id }}/validation_report.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.5"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2
        with:
          cache-name: julia-cache-dense-reference

      - name: Install Julia dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Prepare shard directories
        run: |
          rm -rf "${STAGING_ROOT}" "${PROCESS_ROOT}"
          mkdir -p "${REFERENCE_ROOT}" "${PROCESS_ROOT}"

      - name: Run dense reference xi interval shard
        shell: bash
        env:
          ADVANCED_CONFIG_JSON: ${{ inputs.advanced_config_json || '{}' }}
        run: |
          set -euo pipefail
          advanced_args_path="${RUNNER_TEMP}/pnjl_dense_reference_advanced_args.txt"
          python scripts/pnjl/resolve_dense_reference_action_config.py \
            --config-json "${ADVANCED_CONFIG_JSON}" \
            --output "${advanced_args_path}"
          mapfile -t advanced_args < "${advanced_args_path}"

          cmd=(
            julia --project=. scripts/pnjl/build_dense_phase_reference.jl
            --tag "${{ inputs.tag || 'dense' }}"
            --output-root "${PROCESS_ROOT}"
            --reference-root "${REFERENCE_ROOT}"
            --xi-list "${{ matrix.xi_list }}"
            --T-min "${{ inputs.T_min || '60' }}"
            --T-max "${{ inputs.T_max || '240' }}"
            --T-step "${{ inputs.T_step || '5' }}"
            --T-refine-levels "2"
            --T-position-tol "0.10"
            --T-density-tol "0.01"
            --T-maxwell-area-tol "1e-4"
            --rho-min "${{ inputs.rho_min || '0.0' }}"
            --rho-max "${{ inputs.rho_max || '4.0' }}"
            --rho-step "${{ inputs.rho_step || '0.05' }}"
            --rho-position-tol "0.05"
            --rho-density-tol "0.005"
            --rho-maxwell-area-tol "1e-4"
            --cep-tol "0.1"
            --p-num "${{ inputs.p_num || '24' }}"
            --t-num "${{ inputs.t_num || '8' }}"
            --thermo-quadrature-policy "${{ inputs.thermo_quadrature_policy || 'tensor_gauss' }}"
            --thermo-quadrature-rtol "1e-8"
            --thermo-quadrature-atol "1e-10"
            --thermo-quadrature-maxevals "10000000"
            --iterations "${{ inputs.iterations || '80' }}"
            --crossover-n-mu "${{ inputs.crossover_n_mu || '16' }}"
            --crossover-mu-max "${{ inputs.crossover_mu_max || '450' }}"
          )

          if [ "${{ inputs.adaptive_xi }}" = "true" ]; then
            cmd+=(
              --adaptive-xi
              --xi-refine-levels "2"
              --xi-position-tol "0.10"
              --xi-density-tol "0.01"
              --xi-maxwell-area-tol "1e-4"
              --xi-response-rtol "0.05"
            )
          fi
          if [ "${{ inputs.adaptive_T }}" != "true" ]; then
            cmd+=(--no-adaptive-T)
          fi
          if [ "${{ inputs.rho_geometry_convergence }}" != "true" ]; then
            cmd+=(--no-rho-geometry-convergence)
          fi
          if [ "${{ inputs.crossover_only }}" = "true" ]; then
            cmd+=(--crossover-only)
          fi
          if [ "${{ inputs.crossover_mu0_only }}" = "true" ]; then
            cmd+=(--crossover-mu0-only)
          fi
          if [ "${{ inputs.overwrite }}" = "true" ]; then
            cmd+=(--overwrite)
          fi
          cmd+=("${advanced_args[@]}")

          printf 'Running shard command:\n  %q' "${cmd[@]}"
          printf '\n'
          "${cmd[@]}"

      - name: Validate shard artifact
        shell: bash
        run: |
          validate_cmd=(
            python scripts/pnjl/validate_dense_reference_artifact.py
            --reference-root "${REFERENCE_ROOT}"
            --tag "${{ inputs.tag || 'dense' }}"
            --min-crossover-rows 1
            --report-path "${REPORT_PATH}"
          )
          if [ "${{ inputs.crossover_only }}" = "true" ]; then
            validate_cmd+=(--expect-crossover-only)
          else
            validate_cmd+=(--expect-full-reference)
          fi
          if [ "${{ inputs.crossover_mu0_only }}" = "true" ]; then
            validate_cmd+=(--expect-mu0-only)
          fi
          "${validate_cmd[@]}"

      - name: Upload xi interval shard
        uses: actions/upload-artifact@v4
        with:
          name: pnjl-dense-reference-shard-${{ inputs.tag || 'dense' }}-${{ matrix.shard_id }}
          path: |
            ${{ env.REFERENCE_ROOT }}/*_${{ inputs.tag || 'dense' }}.csv
            ${{ env.REFERENCE_ROOT }}/*_${{ inputs.tag || 'dense' }}.meta.json
            ${{ env.REFERENCE_ROOT }}/phase_reference_${{ inputs.tag || 'dense' }}_manifest.json
            ${{ env.REPORT_PATH }}
          retention-days: ${{ fromJson(env.ARTIFACT_RETENTION_DAYS) }}
          if-no-files-found: error

  merge:
    needs: [plan, generate-shards]
    runs-on: ubuntu-latest
    env:
      ARTIFACT_RETENTION_DAYS: "30"
      SHARDS_ROOT: data/outputs/artifacts/pnjl_dense_reference/${{ github.run_id }}/downloaded_shards
      REFERENCE_ROOT: data/outputs/artifacts/pnjl_dense_reference/${{ github.run_id }}/reference
      REPORT_PATH: data/outputs/artifacts/pnjl_dense_reference/${{ github.run_id }}/validation_report.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download all successful xi shards
        uses: actions/download-artifact@v4
        with:
          pattern: pnjl-dense-reference-shard-${{ inputs.tag || 'dense' }}-*
          path: ${{ env.SHARDS_ROOT }}

      - name: Deterministically merge xi shards
        shell: bash
        run: |
          rm -rf "${REFERENCE_ROOT}"
          mkdir -p "${REFERENCE_ROOT}"
          python scripts/pnjl/merge_dense_phase_reference_shards.py \
            --shards-root "${SHARDS_ROOT}" \
            --reference-root "${REFERENCE_ROOT}" \
            --tag "${{ inputs.tag || 'dense' }}" \
            --expected-xi-list "${{ needs.plan.outputs.expected_xi_csv }}" \
            --overwrite

      - name: Validate merged dense reference artifact
        shell: bash
        run: |
          validate_cmd=(
            python scripts/pnjl/validate_dense_reference_artifact.py
            --reference-root "${REFERENCE_ROOT}"
            --tag "${{ inputs.tag || 'dense' }}"
            --min-crossover-rows 1
            --report-path "${REPORT_PATH}"
          )
          if [ "${{ inputs.crossover_only }}" = "true" ]; then
            validate_cmd+=(--expect-crossover-only)
          else
            validate_cmd+=(--expect-full-reference)
          fi
          if [ "${{ inputs.crossover_mu0_only }}" = "true" ]; then
            validate_cmd+=(--expect-mu0-only)
          fi
          "${validate_cmd[@]}"

      - name: Upload merged dense reference artifact
        uses: actions/upload-artifact@v4
        with:
          name: pnjl-dense-reference-${{ inputs.tag || 'dense' }}
          path: |
            ${{ env.REFERENCE_ROOT }}/*_${{ inputs.tag || 'dense' }}.csv
            ${{ env.REFERENCE_ROOT }}/*_${{ inputs.tag || 'dense' }}.meta.json
            ${{ env.REFERENCE_ROOT }}/phase_reference_${{ inputs.tag || 'dense' }}_manifest.json
            ${{ env.REPORT_PATH }}
          retention-days: ${{ fromJson(env.ARTIFACT_RETENTION_DAYS) }}
          if-no-files-found: error

      - name: Create step summary
        shell: bash
        env:
          SHARD_COUNT: ${{ needs.plan.outputs.shard_count }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["REPORT_PATH"]).read_text(encoding="utf-8"))
          manifest_path = Path(os.environ["REFERENCE_ROOT"]) / "phase_reference_${{ inputs.tag || 'dense' }}_manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          config = manifest["config"]
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary_path.open("a", encoding="utf-8") as fh:
              fh.write("## PNJL Dense Reference Summary\n\n")
              fh.write(f"- artifact: `pnjl-dense-reference-${{ inputs.tag || 'dense' }}`\n")
              fh.write(f"- git commit: `{report['git_commit']}`\n")
              fh.write(f"- recoverable xi interval shards: `{os.environ['SHARD_COUNT']}`\n")
              fh.write(f"- resolved xi values: `{report['xi_values']}`\n")
              fh.write(f"- crossover rows / converged: `{report['crossover_rows']}` / `{report['converged_rows']}`\n")
              fh.write(f"- grid convergence rows / unconverged: `{report['grid_convergence_rows']}` / `{report['grid_unconverged_rows']}`\n")
              fh.write(f"- T range: `${{ inputs.T_min || '60' }} - ${{ inputs.T_max || '240' }}` MeV\n")
              fh.write(f"- explicit crossover T ceiling: `{config['crossover_T_max_MeV']}`\n")
              fh.write(f"- thermo quadrature: `{config['thermo_quadrature_policy']}` (rtol `{config['thermo_quadrature_rtol']}`, atol `{config['thermo_quadrature_atol']}`)\n")
              fh.write(f"- p_num/t_num: `{config['p_num']}` / `{config['t_num']}`\n")
              fh.write(f"- advanced_config_json: `${{ inputs.advanced_config_json || '{}' }}`\n")
          PY
