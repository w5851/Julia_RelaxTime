name: PNJL C2 CEP Three-Midpoint Refinement

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Numerical midpoint run or aggregate replay"
        required: true
        default: numerical
        type: choice
        options: [numerical, aggregate_replay]
      calculation_ref:
        description: "Immutable calculation SHA"
        required: true
        default: 3c5f6b3c9bd535cff7657364dadb2efc31f2ea48
        type: string
      source_run_id:
        description: "Completed numerical source run for replay"
        required: false
        default: ""
        type: string
      source_calculation_sha:
        description: "Source calculation SHA; must match calculation_ref"
        required: false
        default: ""
        type: string
      source_postprocess_sha:
        description: "Source numerical runner/postprocess SHA"
        required: false
        default: ""
        type: string
      rerun_failed_only:
        description: "Run only failed midpoint jobs"
        required: false
        default: false
        type: boolean
      failed_job_keys:
        description: "Comma-separated xi keys"
        required: false
        default: ""
        type: string
      tag:
        description: "Immutable diagnostic tag"
        required: true
        default: issue130_c2_cep_three_midpoint_20260817
        type: string

permissions:
  contents: read
  actions: read

env:
  CALCULATION_SHA: 3c5f6b3c9bd535cff7657364dadb2efc31f2ea48
  WORKFLOW_SCHEMA: pnjl_c2_cep_three_midpoint_refinement_v1
  TARGET_XI: 0.125,0.39375,0.5
  COST_STOP_MINUTES: 200

jobs:
  numerical:
    if: ${{ inputs.run_mode == 'numerical' }}
    name: "C2 three-midpoint CEP xi=${{ matrix.xi }}"
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        xi: ["0.125", "0.39375", "0.5"]
    steps:
      - name: Select failed-only shard
        id: select
        shell: bash
        env:
          XI: ${{ matrix.xi }}
          FAILED_JOB_KEYS: ${{ inputs.failed_job_keys }}
          RERUN_FAILED_ONLY: ${{ inputs.rerun_failed_only }}
        run: |
          if [[ "$RERUN_FAILED_ONLY" == "true" && ",$FAILED_JOB_KEYS," != *",$XI,"* ]]; then
            echo "run_job=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_job=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate immutable calculation SHA
        if: ${{ steps.select.outputs.run_job == 'true' }}
        env:
          INPUT_SHA: ${{ inputs.calculation_ref }}
        run: |
          [[ "$INPUT_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
          [[ "${INPUT_SHA,,}" == "$CALCULATION_SHA" ]] || exit 1

      - name: Checkout workflow head
        if: ${{ steps.select.outputs.run_job == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify workflow head
        if: ${{ steps.select.outputs.run_job == 'true' }}
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Materialize calculation checkout and runner
        if: ${{ steps.select.outputs.run_job == 'true' }}
        env:
          CALCULATION_REF: ${{ inputs.calculation_ref }}
        shell: bash
        run: |
          bracket_rel='docs/analysis/pnjl/c2_limited_feasibility_v1/cep_failures.csv'
          bracket_sha='f8775f3cb7e0457722a523b30eb89485239bdd1730e88f372eeae4e2bc21f3d2'
          git fetch --no-tags origin "$CALCULATION_REF" --depth=1
          git worktree add --detach calculation "$CALCULATION_REF"
          test "$(git -C calculation rev-parse HEAD)" = "$CALCULATION_REF"
          cp scripts/analysis/pnjl_c2_cep_limited_feasibility_job.jl calculation/scripts/analysis/
          test -f "$bracket_rel"
          test "$(sha256sum "$bracket_rel" | awk '{print $1}')" = "$bracket_sha"
          mkdir -p "calculation/$(dirname "$bracket_rel")"
          cp "$bracket_rel" "calculation/$bracket_rel"
          test "$(sha256sum "calculation/$bracket_rel" | awk '{print $1}')" = "$bracket_sha"

      - name: Setup Julia
        if: ${{ steps.select.outputs.run_job == 'true' }}
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.5"

      - name: Cache Julia artifacts
        if: ${{ steps.select.outputs.run_job == 'true' }}
        uses: julia-actions/cache@v2
        with:
          cache-name: julia-cache-c2-cep-three-midpoint-v1

      - name: Install calculation dependencies
        if: ${{ steps.select.outputs.run_job == 'true' }}
        working-directory: calculation
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Run frozen CEP midpoint shard
        if: ${{ steps.select.outputs.run_job == 'true' }}
        env:
          XI: ${{ matrix.xi }}
          TAG: ${{ inputs.tag }}
          CALCULATION_REF: ${{ inputs.calculation_ref }}
          POSTPROCESS_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          mkdir -p "artifacts/xi_${XI}"
          cd calculation
          julia --project=. scripts/analysis/pnjl_c2_cep_limited_feasibility_job.jl \
            --scope cep --xi "$XI" --tag "$TAG" \
            --calculation-sha "$CALCULATION_REF" \
            --postprocess-sha "$POSTPROCESS_SHA" \
            --source-run-id "$SOURCE_RUN_ID" \
            --output-dir "../artifacts/xi_${XI}"

      - name: Upload frozen CEP midpoint shard
        if: ${{ steps.select.outputs.run_job == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: c2-cep-three-midpoint-xi-${{ matrix.xi }}
          path: artifacts/xi_${{ matrix.xi }}
          if-no-files-found: error
          retention-days: 90

  aggregate_replay:
    if: ${{ inputs.run_mode == 'aggregate_replay' }}
    name: C2 three-midpoint CEP aggregate replay
    runs-on: ubuntu-latest
    steps:
      - name: Validate replay inputs and source run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          INPUT_SHA: ${{ inputs.calculation_ref }}
          SOURCE_SHA: ${{ inputs.source_calculation_sha }}
          SOURCE_POSTPROCESS_SHA: ${{ inputs.source_postprocess_sha }}
        shell: bash
        run: |
          [[ "$INPUT_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
          [[ "${INPUT_SHA,,}" == "$CALCULATION_SHA" ]] || exit 1
          [[ -n "$SOURCE_RUN_ID" && "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          [[ -z "$SOURCE_SHA" || "${SOURCE_SHA,,}" == "$CALCULATION_SHA" ]] || exit 1
          payload="$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,conclusion,jobs,headSha)"
          test "$(jq -r .status <<<"$payload")" = completed
          jobs="$(jq '[.jobs[] | select(.name | startswith("C2 three-midpoint CEP xi="))]' <<<"$payload")"
          test "$(jq length <<<"$jobs")" = 3
          test "$(jq '[.[] | select(.conclusion != "success")] | length' <<<"$jobs")" = 0
          source_head="$(jq -r .headSha <<<"$payload")"
          [[ -z "$SOURCE_POSTPROCESS_SHA" || "$SOURCE_POSTPROCESS_SHA" == "$source_head" ]] || exit 1
          echo "SOURCE_HEAD_SHA=$source_head" >> "$GITHUB_ENV"

      - name: Checkout workflow head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download exactly three source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          mkdir -p source-artifacts
          for xi in 0.125 0.39375 0.5; do
            name="c2-cep-three-midpoint-xi-${xi}"
            gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "$name" --dir "source-artifacts/xi_${xi}"
          done

      - name: Validate numerical source artifacts
        shell: bash
        run: |
          python scripts/analysis/pnjl_c2_cep_limited_feasibility.py \
            --mode source_validate --input-dir source-artifacts \
            --expected-calculation-sha "$CALCULATION_SHA" \
            --expected-source-postprocess-sha "$SOURCE_HEAD_SHA" \
            --source-run-id "${{ inputs.source_run_id }}" \
            --target-xi "$TARGET_XI"

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.5"

      - name: Materialize calculation checkout and evaluator
        env:
          CALCULATION_REF: ${{ inputs.calculation_ref }}
        shell: bash
        run: |
          git fetch --no-tags origin "$CALCULATION_REF" --depth=1
          git worktree add --detach calculation "$CALCULATION_REF"
          test "$(git -C calculation rev-parse HEAD)" = "$CALCULATION_REF"
          cp scripts/analysis/pnjl_c2_cep_limited_feasibility.jl calculation/scripts/analysis/

      - name: Install calculation dependencies
        working-directory: calculation
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Run solver-free three-midpoint evaluator
        shell: bash
        run: |
          mkdir -p aggregate
          set +e
          julia --project=calculation calculation/scripts/analysis/pnjl_c2_cep_limited_feasibility.jl \
            --input-dir source-artifacts --output-dir aggregate \
            --expected-calculation-sha "$CALCULATION_SHA" \
            --expected-source-postprocess-sha "$SOURCE_HEAD_SHA" \
            --source-run-id "${{ inputs.source_run_id }}" \
            --target-xi "$TARGET_XI" \
            --workflow-schema "$WORKFLOW_SCHEMA"
          status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then exit "$status"; fi
          echo "evaluator_exit_status=$status" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate aggregate and render figure
        shell: bash
        run: |
          python -m pip install matplotlib==3.9.2
          set +e
          python scripts/analysis/pnjl_c2_cep_limited_feasibility.py \
            --mode aggregate_validate --aggregate-dir aggregate \
            --expected-calculation-sha "$CALCULATION_SHA" \
            --source-run-id "${{ inputs.source_run_id }}" \
            --target-xi "$TARGET_XI" \
            --expected-workflow-schema "$WORKFLOW_SCHEMA"
          status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then exit "$status"; fi
          cat aggregate/manifest.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload three-midpoint CEP evidence
        uses: actions/upload-artifact@v4
        with:
          name: c2-cep-three-midpoint-${{ inputs.tag }}-aggregate
          path: aggregate
          if-no-files-found: error
          retention-days: 90
