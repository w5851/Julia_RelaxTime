name: PNJL Stage-C Density Certificate Feasibility v2
run-name: Stage-C density feasibility v2 / aggregate replay / ${{ inputs.tag || 'v2' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Replay the completed numerical source run"
        required: false
        default: aggregate_replay
        type: choice
        options: [aggregate_replay]
      calculation_ref:
        description: "Immutable calculation SHA used by the source numerical run"
        required: true
        type: string
      source_run_id:
        description: "Completed 30-job numerical source run id"
        required: true
        type: string
      source_calculation_sha:
        description: "Calculation SHA recorded by the source run"
        required: true
        type: string
      source_postprocess_sha:
        description: "Source workflow head SHA recorded in each job manifest"
        required: true
        type: string
      tag:
        description: "Versioned v2 evidence artifact tag"
        required: false
        default: cep_hybrid_stagec_density_certificate_feasibility_v2
        type: string

permissions:
  contents: read
  actions: read

jobs:
  aggregate_replay:
    if: ${{ inputs.mode == 'aggregate_replay' }}
    name: replay Stage-C density feasibility v2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate source numerical run and immutable SHAs
        shell: bash
        env:
          CALCULATION_REF: ${{ inputs.calculation_ref }}
          SOURCE_CALCULATION_SHA: ${{ inputs.source_calculation_sha }}
          SOURCE_POSTPROCESS_SHA: ${{ inputs.source_postprocess_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          EXPECTED_SOURCE_RUN_ID: "31296511813"
          EXPECTED_CALCULATION_SHA: "ffa816df0a145f73d7490db1ed9ff10c92e017a4"
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$CALCULATION_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "calculation_ref must be a 40-character SHA" >&2; exit 1; }
          [[ "$CALCULATION_REF" == "$EXPECTED_CALCULATION_SHA" ]] || { echo "v2 replay is pinned to the approved calculation SHA" >&2; exit 1; }
          [[ "$SOURCE_CALCULATION_SHA" == "$CALCULATION_REF" ]] || { echo "source_calculation_sha must match calculation_ref" >&2; exit 1; }
          [[ "$SOURCE_POSTPROCESS_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "source_postprocess_sha must be a 40-character SHA" >&2; exit 1; }
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "source_run_id must be numeric" >&2; exit 1; }
          test "$SOURCE_RUN_ID" = "$EXPECTED_SOURCE_RUN_ID"
          payload="$(gh run view "$SOURCE_RUN_ID" --json status,conclusion,jobs,headSha)"
          test "$(echo "$payload" | jq -r .status)" = completed
          source_conclusion="$(echo "$payload" | jq -r .conclusion)"
          source_head="$(echo "$payload" | jq -r .headSha)"
          test "$source_head" = "$SOURCE_POSTPROCESS_SHA"
          numeric_jobs="$(echo "$payload" | jq '[.jobs[] | select(.name | startswith("density certificate xi="))] | length')"
          test "$numeric_jobs" = 30
          numeric_failures="$(echo "$payload" | jq '[.jobs[] | select(.name | startswith("density certificate xi=")) | select(.conclusion != "success")] | length')"
          test "$numeric_failures" = 0
          echo "SOURCE_RUN_CONCLUSION=$source_conclusion" >> "$GITHUB_ENV"
          echo "Source run $SOURCE_RUN_ID completed: numerical_jobs=$numeric_jobs, conclusion=$source_conclusion."
          echo "A failed source workflow conclusion is allowed only when all 30 numerical jobs succeeded."

      - name: Checkout workflow and postprocess head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify workflow head SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.5"

      - name: Materialize calculation checkout and evaluator
        shell: bash
        env:
          CALCULATION_REF: ${{ inputs.calculation_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CALCULATION_REF" --depth=1
          git worktree add --detach calculation "$CALCULATION_REF"
          test "$(git -C calculation rev-parse HEAD)" = "$CALCULATION_REF"
          cp scripts/analysis/pnjl_stagec_density_certificate_feasibility_v2.jl calculation/scripts/analysis/

      - name: Install calculation dependencies
        working-directory: calculation
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Download source numerical artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: gh run download "$SOURCE_RUN_ID" --pattern 'stagec-density-certificate-*' --dir source-artifacts

      - name: Run solver-free v2 evaluator from calculation SHA
        shell: bash
        env:
          CALCULATION_REF: ${{ inputs.calculation_ref }}
          SOURCE_POSTPROCESS_SHA: ${{ inputs.source_postprocess_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
        run: |
          set +e
          julia --project=calculation calculation/scripts/analysis/pnjl_stagec_density_certificate_feasibility_v2.jl \
            --input-dir source-artifacts \
            --output-dir aggregate \
            --expected-calculation-sha "$CALCULATION_REF" \
            --expected-source-postprocess-sha "$SOURCE_POSTPROCESS_SHA" \
            --source-run-conclusion "$SOURCE_RUN_CONCLUSION" \
            --producer-head-sha "$WORKFLOW_HEAD_SHA"
          status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi
          echo "feasibility_exit_status=$status" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Python plotting environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fixed plotting dependency
        run: python -m pip install matplotlib==3.9.2

      - name: Render representative v2 figures and refresh manifest
        run: |
          python scripts/analysis/plot_pnjl_stagec_density_certificate_feasibility_v2.py \
            --input-dir source-artifacts \
            --output-dir aggregate \
            --replay-dir aggregate

      - name: Validate v2 evidence contract
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          test -f aggregate/manifest.json
          test "$(jq -r .schema_version aggregate/manifest.json)" = "cep_hybrid_stagec_density_certificate_feasibility_v2"
          test "$(jq -r .source_run_id aggregate/manifest.json)" = "$SOURCE_RUN_ID"
          test "$(jq -r .source_job_count aggregate/manifest.json)" = 30
          test "$(jq -r .solver_called aggregate/manifest.json)" = false
          test -f aggregate/route_comparison.csv
          test -f aggregate/component_geometry.csv
          test -f aggregate/selected_point_index.csv
          test -f aggregate/candidate_point_index.csv
          test -f aggregate/cost_frontier.csv
          test -f aggregate/plot_manifest.json
          cat aggregate/manifest.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable v2 feasibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: stagec-density-certificate-v2-${{ inputs.tag }}-aggregate-replay
          path: aggregate
          if-no-files-found: error
          retention-days: 90
