name: ci-integration

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/integration/**"
      - "config/**"
      - "Project.toml"
      - "Manifest.toml"
      - ".github/workflows/ci-integration.yml"
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/integration/**"
      - "config/**"
      - "Project.toml"
      - "Manifest.toml"
      - ".github/workflows/ci-integration.yml"
  workflow_dispatch:

jobs:
  integration-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2
        with:
          cache-name: julia-cache-integration

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Run integration smoke profile
        env:
          INTEGRATION_PROFILE: smoke
        run: julia --project=. tests/integration/runtests.jl
