name: 功能建议
description: 提出新功能或改进建议（用于先立项再实施）
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        建议按“问题 -> 方案 -> 验收 -> 实施分解”填写，便于直接进入执行。

  - type: dropdown
    id: feature_type
    attributes:
      label: 需求类型
      options:
        - new feature
        - enhancement
        - refactor (non-functional)
        - docs/process improvement
    validations:
      required: true

  - type: dropdown
    id: module_scope
    attributes:
      label: 目标模块范围
      options:
        - models/workflow
        - models/phase
        - relaxtime
        - simulation/server
        - config/docs/tooling
        - tests/ci
        - cross-module
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 描述当前痛点、使用场景、为何现在需要处理。
    validations:
      required: true

  - type: textarea
    id: goals
    attributes:
      label: 目标与非目标
      description: 明确做什么/不做什么，防止范围失控。
      placeholder: |
        目标：
        - ...
        非目标：
        - ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望 API/入口、数据产物、配置变更或交互方式。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准（DoD）
      description: 建议写成可验证条目（测试、文档、回归、性能等）。
      placeholder: |
        - [ ] 单元/集成测试通过：...
        - [ ] 必要文档更新：...
        - [ ] 回归风险已评估：...
    validations:
      required: true

  - type: textarea
    id: test_plan
    attributes:
      label: 计划验证命令
      description: 预期执行的测试或脚本命令。
      render: bash
      placeholder: |
        julia --project=. -e 'ENV["UNIT_FILES"]="..."; include("tests/unit/runtests.jl")'
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: 风险与兼容性影响（可选）
      description: 涉及 API 变更、基线漂移、性能影响、迁移成本时请说明。

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案/参考资料（可选）

  - type: checkboxes
    id: governance
    attributes:
      label: 立项前检查
      options:
        - label: 我已明确目标与非目标
          required: true
        - label: 我已给出可执行的验收标准（DoD）
          required: true
        - label: 我已提供至少一条验证命令或验证方式
          required: true
