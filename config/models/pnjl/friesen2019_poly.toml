[model]
N_color = 3
N_flavor = 3
rho0_fm3 = 0.16
Lambda_MeV = 652.0
# Keep the same convention mapping as config/physics/friesen2019_base.toml:
# this repo's (G, K) correspond to the literature's (gS / 2, -gD).
G_over_Lambda2 = 0.9139736
K_over_Lambda5 = -10.592480432297679
m_ud0_MeV = 5.5
m_s0_MeV = 131.0
# Friesen 2019 Eq.(2) writes the thermal contribution with ∫_0^∞ dp.
# The repo now supports profile-level thermal_p_max_MeV tuning, but keep the
# default here at the legacy-stable 10 fm^-1 until the PNJL solver path is
# stabilized for larger near-infinity approximations such as 20 fm^-1.
thermal_p_max_MeV = 1973.269804

[polyakov]
scheme = "poly"
T0_MeV = 190.0
a0 = 6.75
a1 = -1.95
a2 = 2.625
a3 = -7.44
b3 = 0.75
b4 = 7.5
