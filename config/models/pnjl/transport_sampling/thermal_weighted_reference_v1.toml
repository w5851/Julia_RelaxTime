# Tighter companion to `thermal_weighted_v1`, reproducing the reference
# configuration recorded in
# `tests/baselines/relaxtime/baseline_thermal_weighted_transport_v3.json`
# (`configurations.reference`).  The twelve-point transport regression compares
# the production entrypoint (candidate profile) against this reference within a
# 1% band, so the reference has to be an in-repository artifact rather than an
# ad-hoc CLI override list.
schema_version = 1
id = "thermal_weighted_reference_v1"
algorithm = "thermal_weighted"

[background]
thermal_p_max_inv_fm = 30.0
p_nodes = 128
cos_nodes = 32
residual_norm_max = 1.0e-8

[a_integral]
p_nodes = 64
cos_nodes = 32
scale_inv_fm = 5.0

[tau_integral]
p_nodes = 128
cos_nodes = 48
phi_nodes = 54
t_nodes = 48
scale_inv_fm = 10.0

[terminal_integral]
p_nodes = 64
cos_nodes = 32
scale_inv_fm = 5.0

# The recorded reference configuration of the twelve-point baseline tightens the
# quadrature nodes only; it keeps the default sampling block.  Raising `rtol`
# here instead exhausts `max_events` on the first point (thermal measure event
# budget), which silently drops the point from the scan.
[sampling]
rtol = 1.0e-3
atol = 1.0e-12
weighted_window = 0.6
seed_order = 48
max_evaluations = 40000
max_nodes = 12000
max_rounds = 40
max_events = 30000000
