# 数据归档策略（单一事实源）
#
# 用途：登记 data/outputs/** 下应当保留的归档二进制（zip）与已退役归档的墓碑。
# 门禁：scripts/dev/check_data_output_path_guard.jl（CI: data-output-path-guard）
#
# 判定语义：
# - 新增/改名的 zip 必须登记在 retained_archives 或 pending_retirement 中；
# - 删除 zip 必须登记在 retired_archives 中，且保留还原锚点（git_blob / declared_commit）；
# - retained_archives 与 pending_retirement 的 sha256 必须与工作区实际文件一致；
# - retired_archives 的 path 不得仍在工作区存在。
# 现存但未登记的 zip 只作为 advisory 汇总，不阻断 CI。

schema = "data_archive_policy_v1"

# ---------------------------------------------------------------------------
# 快照孤本清单
#
# 2026-10-25 / 2026-10-26 那批 source.zip 是脏工作区快照：相对声明 commit
# dffe4070eb5c，每包有 45 个同名文件内容不同、67–81 个文件尚未入库。
# 按 CRLF 归一化后逐 blob 核对，下列 13 处内容从未进入任何提交，只能由
# retired_archives 记录的 git_blob 精确取回。
# 另有 12 处候选差异经归一化确认仅为换行符差异，可由历史提交还原。
# ---------------------------------------------------------------------------

[unique_snapshot_blobs]
note = "内容从未进入任何提交的快照文件；13 处是 7 个 dffe4070eb5c 批次 source.zip 的并集（第 8 个 runner_review_checks 为干净包，可由 2e5c411c716d 重建），取回时先按所属包的 git_blob 解包再取对应路径；另 12 处候选差异经 CRLF 归一化确认仅为换行符差异，可由历史提交还原"
paths = [
  ".github/workflows/ci-integration.yml",
  ".github/workflows/relaxtime-phase-guided-transport-production.yml",
  "benchmark/relaxtime/bench_full_rs_a_reduction.jl",
  "config/governance/task_tracks.toml",
  "docs/guides/scripts/transport_sampling_qualification.md",
  "scripts/analysis/relaxtime/ThresholdUpgradeCommon.jl",
  "scripts/analysis/relaxtime/run_transport_full_rs_layer_validation.jl",
  "scripts/analysis/relaxtime/run_transport_joint_validation.jl",
  "scripts/analysis/relaxtime/run_transport_production_validation.jl",
  "scripts/dev/export_thermal_weighted_transport_baseline.py",
  "tests/regression/relaxtime/native_transport_fixture.jl",
  "tests/unit/python/test_transport_production_baseline.py",
  "tests/unit/runtests.jl",
]

