schema_version = "v1"
profile_name = "default"

[scan.transport]
muB_MeV = 0.0
xi_list = [-0.3, -0.2, -0.1, 0.0, 0.1, 0.2, 0.3]
tmin_MeV = 120.0
tmax_MeV = 350.0
tstep_MeV = 10.0
resume = true
overwrite = false

[scan.transport.solver]
p_num = 12
t_num = 6
max_iter = 40

[scan.transport.tau]
mode = "finite_15"
tau_p_nodes = 20
tau_angle_nodes = 4
tau_phi_nodes = 8
tau_n_sigma = 6
sigma_grid_n = 60

[scan.transport.transport]
compute_bulk = true
tr_p_nodes = 24
tr_p_max_fm = 8.0

[scan.cross_section]
muB_MeV = 0.0
T_list_MeV = [150.0, 250.0]
xi_list = [-0.3, -0.2, -0.1, 0.0, 0.1, 0.2, 0.3]
processes = ["ud_to_ud", "us_to_us", "udbar_to_udbar", "usbar_to_usbar"]
n_points = 64

[scan.cross_section.energy]
mode = "linspace"
sqrt_s_min_MeV = 300.0
sqrt_s_max_MeV = 2000.0
sqrt_s_num = 64

[plot.transport]
x = "T_MeV"
group = "xi"
ys = [
  "eta_over_s",
  "zeta_over_s",
  "sigma_over_T",
  "sigma_over_T_over_eta_over_s",
  "zeta_over_s_over_eta_over_s",
  "tau_u",
  "tau_d",
  "tau_s",
  "tau_ubar",
  "tau_dbar",
  "tau_sbar",
]

[plot.cross_section]
x = "sqrt_s_MeV"
group = "xi"
split = "process"
