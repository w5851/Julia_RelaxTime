]
"src/models/gap_solver.jl" = [
  "Base\\.invokelatest\\(omega,\\s*model,\\s*st,\\s*T,\\s*μ;",
]
"src/models/factory.jl" = [
  "Base\\.invokelatest\\(ctor;\\s*kwargs\\.\\.\\.\\)",
]
"src/models/entrypoints.jl" = [
  "Base\\.invokelatest\\(scan\\.pnjl_module_ref\\)",
  "Base\\.invokelatest\\(bridge\\.module_ref\\)",
  "Base\\.invokelatest\\(fn,\\s*args\\.\\.\\.;\\s*kwargs\\.\\.\\.\\)",
]
"src/models/derivative_entrypoints.jl" = [
