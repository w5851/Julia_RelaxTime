# Chemical freeze-out trajectory; published central values without tuning.
# Source: https://arxiv.org/abs/1906.01954v2; Eq. (5), PDF pp.8-9 Table II IHRG row.
# Yield-fit parameterization spanning SIS to LHC; uses the IHRG branch.
# Polynomial family describes algebra only; it does not identify the fitted source.
# Normalized source form, when used: T=T0*(1-k2*(muB/T0)^2-k4*(muB/T0)^4).
# Exact coefficient conversion: b=k2/T0 and c=k4/T0^3, with T0 in GeV.
profile_name = "ihrg2019"
family = "cleymans_polynomial_rational_v1"
source_tag = "ihrg2019_arxiv1906.01954v2_published_central"

[coefficients]
a_GeV = 0.152
b_GeV_inv1 = 0.026
c_GeV_inv3 = 0.219
d_GeV = 1.31
e_GeV_inv1 = 0.278
