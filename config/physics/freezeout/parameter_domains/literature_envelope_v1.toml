schema = "chemical_freezeout_literature_envelope_v1"
parameter_order = ["a_GeV", "b_GeV_inv1", "c_GeV_inv3", "d_GeV", "e_GeV_inv1"]
formula = "T=a-b*muB^2-c*muB^4; muB=d/(1+e*sqrt_s_NN_GeV)"
policy = "cross-literature coordinate envelope; not a joint confidence region"
author_decision = "2026-10-18: permit cross-source combinations without restricting to one publication"
source_root = "data/inputs/meson_freezeout_polynomial_literature_20261017"

[design]
seed = 20261018
interior_trim_fraction = 0.10
interior_sample_count = 32
proposal_count = 2048
minimum_energy_GeV = 4.87
maximum_energy_GeV = 200.0
primary_energies_GeV = [7.7, 11.5, 14.5, 19.6, 27.0, 39.0, 62.4, 130.0, 200.0]
screening_energies_GeV = [4.87, 6.27, 7.62, 7.7, 8.77, 9.25, 10.0, 11.5, 12.32, 14.5, 17.27, 19.6, 27.0, 39.0, 62.4, 130.0, 200.0]
near_best_rmse_factor = 1.10
local_step_fraction = 0.05
local_rounds = 1
description = "Interior sampling in the middle 80% of each pooled coordinate interval; unmodified source anchors and explicit low-T hybrids retained separately. Positive T across the declared energy window is required. No numerical failure may remove an observation from the fixed scoring grid."

